# CPU profile —— 没有 GPU 也能跑通全链路（B2）
#
# 为什么要有这个文件：没有 GPU 就完全跑不起来，是本项目最大的单点采用阻塞。
# 这套配置把解析换成进程内的 born-digital 引擎（有文字层的 PDF），
# embedding 换成 TEI 的 CPU 镜像，**不启 VQA** —— 视觉验证做不了，
# 但那不是特例代码路径，而是既有降级路径的正常使用：问答照常回答，
# 并打上 degraded="vision_unavailable"，用户看得见。
#
# 启动：
#   cd docker && docker compose -f compose.cpu.yml --env-file ../.env up -d --build
#
# 一次性准备（只有 embedding 需要）：
#   python scripts/prepare_bge_m3.py      # 下权重并转 safetensors，TEI 只认它
# 不想装这一步就把下面的 embed 服务和 models.cpu.yaml 里的 embedding_models 一起注释掉：
# 注册表里没有 embedding 段时，检索链自动退回 BM25（注册表驱动的开关，不用改代码）。
#
# 覆盖范围要说在前面：born-digital 只处理**有文字层的 PDF**。
# 扫描件、表格结构、公式需要 mineru —— 见文件末尾被注释的 mineru 服务（CPU 上很慢）。

# 固定 compose 项目名。**不能省**：项目名缺省取 compose 文件所在目录名，
# 而两个仓库的这个目录都叫 docker —— 于是两边算出同一个项目名 "docker"，
# 同名服务（redis）会互相顶掉：起 service 的 redis 会把 Web 的 redis 容器直接换掉。
name: ddp-service

services:
  gateway:
    build:
      context: ../gateway
      args: { PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple" }
    ports: ["9000:9000"]
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      REDIS_URL: redis://redis:6379/0
      MODELS_CONFIG: /app/models.cpu.yaml
    volumes:
      - ../models.cpu.yaml:/app/models.cpu.yaml:ro
    depends_on: [redis]

  arq-worker:
    build:
      context: ../gateway
      args: { PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple" }
    command: arq app.worker.tasks.WorkerSettings
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      REDIS_URL: redis://redis:6379/0
      MODELS_CONFIG: /app/models.cpu.yaml
    volumes:
      - ../models.cpu.yaml:/app/models.cpu.yaml:ro
    depends_on: [redis]
    # born-digital 的抽取跑在 worker 里（API 进程不该被一份 200 页 PDF 卡住）

  mcp-server:
    build:
      context: ../mcp_server
      args: { PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple" }
    ports: ["9100:9100"]
    environment:
      GATEWAY_URL: http://gateway:9000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      REDIS_URL: redis://redis:6379/0
    depends_on: [gateway]

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  embed:
    # bge-m3 向量化，CPU 版 TEI。前置见文件头（权重要先转 safetensors）。
    # --max-batch-tokens 必须限住：bge-m3 支持 8192 上下文，按最大长度预热会吃爆内存
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    command: >
      --model-id /data/bge-m3 --pooling cls --port 8080
      --max-batch-tokens 4096 --max-client-batch-size 32
    ports: ["18080:8080"]
    volumes:
      - ../../models/bge-m3:/data/bge-m3:ro

  # v1.1 rerank（交叉编码器精排）。要用就打开这里 + models.cpu.yaml 的 rerank_models 段。
  # 与 embed 是同一类容器换个 model —— 几乎零新增运维面（这正是 D1 选 TEI 的理由）。
  # CPU 上每个候选一次前向，比双塔慢得多；候选控制在 20~30 条时实测可接受。
  # 权重：modelscope download --model BAAI/bge-reranker-v2-m3 --local_dir ../../models/bge-reranker-v2-m3
  # rerank:
  #   image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
  #   command: >
  #     --model-id /data/bge-reranker-v2-m3 --port 8080
  #     --max-batch-tokens 4096 --max-client-batch-size 32
  #   ports: ["18082:8080"]
  #   volumes:
  #     - ../../models/bge-reranker-v2-m3:/data/bge-reranker-v2-m3:ro

  # 需要 OCR / 表格 / 公式时再打开（同时去掉 models.cpu.yaml 里 mineru 那几行的注释）。
  # CPU 上比 GPU 慢一到两个数量级，适合小批量试用，不适合日常迭代。
  # mineru:
  #   build: ./mineru
  #   image: mineru:3.4.4
  #   command: mineru-api --host 0.0.0.0 --port 8000
  #   environment:
  #     MINERU_DEVICE_MODE: cpu

  # 没有 vqa 服务 —— 见文件头。问答会照常工作并标 degraded="vision_unavailable"。
  # 文本回答本身需要一个 OpenAI 兼容的 chat 端点：在 DeepDocParse-Web 的 .env 里
  # 把 CHAT_URL 指到任意兼容服务（本地 llama.cpp / Ollama / 托管 API 都行，ADR #17）。
  #
  # **抽取平面（/v1/extract）也需要那个 chat 端点**，而且它读的是 service 侧的
  # models.yaml vqa_models 段（不是 Web 的 CHAT_URL）。纯 CPU 部署要用 /v1/extract 的话，
  # 在 models.cpu.yaml 里注册一个本地 chat endpoint 到 vqa_models 即可 ——
  # 抽值只用文本，它不必真是视觉模型（视觉核对是可选项 EXTRACT_VERIFY）。

volumes:
  redis-data:
