# dev profile —— RTX 4060 Laptop 8GB
# MinerU 走 pipeline 后端（4GB 够用）；DeepSeek-OCR 用 deepseek-ocr.rs 量化版。
# 显存有限：两模型不必同时驻留，M1 阶段可先注释 vqa-dsocr。
#
# 启动: docker compose -f compose.dev.yml --env-file ../.env up --build

services:
  gateway:
    build:
      context: ../gateway
      args: { PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple" }
    ports: ["9000:9000"]
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      REDIS_URL: redis://redis:6379/0
      MODELS_CONFIG: /app/models.yaml
    volumes:
      - ../models.yaml:/app/models.yaml:ro
    depends_on: [redis]

  arq-worker:
    build:
      context: ../gateway
      args: { PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple" }
    command: arq app.worker.tasks.WorkerSettings
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      REDIS_URL: redis://redis:6379/0
      MODELS_CONFIG: /app/models.yaml
    volumes:
      - ../models.yaml:/app/models.yaml:ro
    depends_on: [redis]

  mcp-server:
    build:
      context: ../mcp_server
      args: { PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple" }
    ports: ["9100:9100"]   # 对外应由 backend 代理；dev 直开便于 Claude Desktop 实测
    environment:
      GATEWAY_URL: http://gateway:9000
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      REDIS_URL: redis://redis:6379/0   # v2 向量检索（不配则纯 BM25）
    depends_on: [gateway]

  redis:
    # 用 redis-stack：v2 向量检索不换组件（版本 pin，禁止 latest）
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  mineru:
    # 官方组件，不重写。Dockerfile 改编自官方中国区版本并锁定 3.4.4，见 ./mineru/Dockerfile
    # 官方部署文档：https://opendatalab.github.io/MinerU/quick_start/docker_deployment/
    build: ./mineru
    image: mineru:3.4.4
    command: mineru-api --host 0.0.0.0 --port 8000   # dev 单 worker，gateway 直连
    environment:
      MINERU_DEVICE_MODE: cuda   # pipeline 后端；纯 CPU 调试改 cpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # vqa-dsocr（M2 决策）：deepseek-ocr.rs v0.6.0 无 Linux CUDA 预编译产物，
  # dev 机不进容器——用官方 Windows 原生二进制跑在宿主机（ModelScope 自动下权重），
  # gateway 侧注册表用 ../models.dev-host.yaml（endpoint 指宿主机 18001，
  # 容器内访问写 host.docker.internal:18001）。prod 用 compose.prod-nvidia.yml 的 vLLM 容器。
  # 若将来官方发布 Linux CUDA 产物，再恢复本服务并 pin 版本：
  # vqa-dsocr:
  #   image: deepseek-ocr-rs:<PIN>
  #   ports: ["18001:8000"]   # 宿主端口避开 Windows 保留段 7964-8063
  #   deploy: ...gpu...

  embed:
    # v2（M4）：bge-m3 向量化，dev 用 CPU 版 TEI（无显存占用，可与 mineru 同跑）
    #
    # 前置（否则启动即失败，已实测）：
    #   1. TEI 只认 safetensors，而 BAAI/bge-m3 官方只发 .bin ——
    #      必须先跑 `python scripts/prepare_bge_m3.py` 把权重下好并转换到 ../../models/bge-m3
    #   2. --pooling cls：本地权重缺 1_Pooling/config.json，须显式指定（bge 系用 CLS）
    #   3. --max-batch-tokens：bge-m3 支持 8192 上下文，按最大长度预热会吃爆内存
    #      （8GB 机器上实测 OOM 137），必须限住
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9.3
    command: >
      --model-id /data/bge-m3 --pooling cls --port 8080
      --max-batch-tokens 4096 --max-client-batch-size 32
    ports: ["18080:8080"]   # 宿主端口避开 Windows 保留段 7964-8063
    volumes:
      - ../../models/bge-m3:/data/bge-m3:ro

volumes:
  redis-data:
