[alembic]
script_location = alembic
prepend_sys_path = .
# NOTE: keep this file pure ASCII -- configparser reads it with the system locale
# encoding (GBK on this machine) and dies on non-ASCII bytes.
# The DB URL is intentionally absent: env.py reads it from app.config.settings.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
