[project]
name = "deepdocparse-web-backend"
version = "0.1.0"
description = "OCR Web 后端：用户/APIkey/额度/归档/代理"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic-settings>=2.4",
    "python-jose[cryptography]>=3.3",   # JWT
    "bcrypt>=4.1",                      # 直接用官方库（passlib 已停更且与 bcrypt 4.x 冲突）
    "minio>=7.2",
    "python-multipart>=0.0.9",          # FastAPI 接收 multipart 上传的前提
    "pgvector>=0.3",                    # 向量列与 <=> 检索（仅 PostgreSQL 生效）
    "pypdfium2>=4.30",                  # 出处区域裁剪（service 侧 mcp_server 同款）
    "pillow>=10.0",                     # 同上：裁剪后的位图处理
    "redis>=5.0",                       # 多副本：限速令牌桶与对账选主
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "aiosqlite>=0.20",
    "redis>=5.0",   # 仅 scripts/e2e_web.py 用：核对 service 侧的检索路径计数
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
