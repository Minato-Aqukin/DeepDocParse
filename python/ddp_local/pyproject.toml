[project]
name = "ddp-local"
version = "0.1.0"
description = "DeepDocParse offline workspace runtime with shared knowledge business rules"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["ddp-core", "httpx>=0.27"]

[project.optional-dependencies]
cpu = ["pypdfium2>=4.30"]
http = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "reportlab>=4", "ddp-local[http,cpu]"]

[project.scripts]
ddp-local = "ddp_local.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "../../tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddp_local"]
