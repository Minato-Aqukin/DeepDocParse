[project]
name = "deepdocparse-gateway"
version = "0.1.0"
description = "DeepDocParse 薄网关：协议转换 / 鉴权 / 结果归档 / metrics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "arq>=0.26",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "prometheus-fastapi-instrumentator>=7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "fakeredis>=2.26"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
