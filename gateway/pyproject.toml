[project]
name = "deepdocparse-gateway"
version = "0.1.0"
description = "DeepDocParse 薄网关：协议转换 / 鉴权 / 结果归档 / metrics"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "arq>=0.26",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "prometheus-fastapi-instrumentator>=7.0",
    # born-digital 兜底解析引擎（无 GPU 时抽 PDF 文字层 + 坐标）。
    # 不是模型，是 PDF 库 —— 铁律 3 禁的是 import 模型代码，不是禁止解析 PDF 结构
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "fakeredis>=2.26"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["../tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# **两个包，不是一个。** `ddp_core` 是与 Web 共享的语料核心逻辑，
# 单独占一个顶层包名 —— 因为 web backend 的发行包也声明了 `packages = ["app"]`，
# 两个 `app` 装进同一个环境会直接撞车（见 ddp_core/__init__.py 的说明）。
packages = ["app", "ddp_core"]
