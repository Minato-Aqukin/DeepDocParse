# 前端：类型检查、组件单测、构建、端到端门禁。
name: web

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # package-lock.json 的 resolved 全部指向 registry.npmmirror.com（仓库文件，
      # 不重生成）。npm 会把跨 host 的 tarball 当成 "remote" 类型直接拒掉
      # （EALLOWREMOTE），所以这里必须显式带上原 registry
      - name: 安装依赖
        run: npm ci --registry=https://registry.npmmirror.com

      - name: 类型检查 + 构建
        run: npm run build

      # 类型检查够不着的那一类：卸载后定时器还在跑、blob URL 没回收、
      # ResizeObserver 没断
      - name: 组件单测
        run: npm run test:unit

      - name: 装 Playwright 浏览器
        run: npx playwright install --with-deps chromium

      # 产品门禁全在 e2e 里：零 console error/warn · 全路由可达 · 两套主题 ·
      # 零投影零字距 · 不破版 · 键盘可达。**必须进 CI** ——
      # 一次性检查挡不住下一个 commit 的退化
      - name: 端到端门禁
        run: npm run test:e2e
