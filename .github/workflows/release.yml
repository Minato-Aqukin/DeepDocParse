# 把一次 desktop-windows 构建的安装包转成 GitHub Release。
#
# 为什么单独一个工作流：release 资产必须从持有文件的地方上传。
# 安装包只存在于构建机（已销毁）和 artifact blob 里 —— 本地链路到 blob
# 只有几十 KB/s，475MB 拉不下来。所以下载（artifact）和上传（release）
# 都在 GitHub 机房内网完成，不经过本地。
#
# 用法：Actions 页选 release → Run workflow → 填已成功的 desktop-windows
# 运行 ID 与 tag。只发 setup 安装版（NSIS）；便携版留在 artifact 里。
name: release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: '已成功的 desktop-windows 运行 ID（取其 windows-installers 构件）'
        required: true
      tag:
        description: '发行版 tag（不存在则创建）'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: 取回安装包构件
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "${{ inputs.run_id }}" -n windows-installers -D dist/release
          ls -la dist/release

      # 防拿错包：SHA256SUMS 是打包机现场算的，对着它验不过就直接红。
      # 构件里套了一层目录（upload-artifact 保留了 dist/desktop/windows 结构），
      # 所以用 find 定位，不写死路径。
      - name: 校验安装包哈希
        run: |
          SUMS=$(find dist/release -name SHA256SUMS | head -n 1)
          if [ -z "$SUMS" ]; then echo "构件里没有 SHA256SUMS" >&2; exit 1; fi
          echo "校验清单：$SUMS"
          (cd "$(dirname "$SUMS")" && sha256sum -c "$(basename "$SUMS")")

      - name: 发布 Release（仅 setup 安装版）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SETUP=$(find dist/release -name 'DeepDocParse-*-setup.exe' | head -n 1)
          if [ -z "$SETUP" ] || [ "$(find dist/release -name 'DeepDocParse-*-setup.exe' | wc -l)" -ne 1 ]; then
            echo "setup exe 数量不对" >&2; exit 1
          fi
          DIR="$(dirname "$SETUP")"
          BASE="$(basename "$SETUP")"
          gh release create "${{ inputs.tag }}" \
            --title "DeepDocParse ${{ inputs.tag }}（Windows 桌面版）" \
            --notes "Windows 安装版（NSIS）。SHA256 见同页 ${BASE}.sha256。构建来源：desktop-windows 运行 ${{ inputs.run_id }}。" \
            "$DIR/$BASE" "$DIR/$BASE.sha256" "$DIR/SHA256SUMS"
