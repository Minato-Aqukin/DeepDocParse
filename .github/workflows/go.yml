# Go 控制面。
name: go

on:
  push:
    branches: [main]
  pull_request:

jobs:
  control-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/control-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache-dependency-path: services/control-api/go.sum

      # 生成物也要 gofmt 干净 —— 不然 `gofmt -l` 会永远报那个文件，
      # 然后所有人学会忽略它
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::这些文件没有 gofmt 过：$unformatted"
            exit 1
          fi

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -count=1

      # 竞态检测跑一遍：控制面全是并发路径（代理、限速、后台投递），
      # 数据竞争的表现是"偶尔出错"，靠人看是看不出来的
      - name: test -race
        run: go test ./... -race -count=1

      - name: build
        run: go build ./...
