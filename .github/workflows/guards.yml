# 全局门禁：与语言无关的守卫。**合并队列前必须绿**（§15.1）。
#
# 这些检查此前散在两个仓库、或者根本不在 CI 里 —— 分块回归守卫就因为
# 不在任何 CI 里而红了四天没人看见（docs/refactor/FINDINGS.md F-2）。
# 守卫不进 CI 等于没有守卫。
name: guards

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "1.27"
          cache-dependency-path: services/control-api/go.sum

      - name: 安装 Python 包
        run: |
          python -m pip install --upgrade pip
          # **一条命令装完，不能分开装。**
          # `corpus-api[dev]` 依赖 `ddp-corpus-worker`（测试要用 worker 真正的
          # handler 表），而 `corpus-worker` 又依赖 `ddp-corpus-api` ——
          # 运行时方向是 worker -> api 不成环，但**加上 dev extra 就成环了**。
          # 分开装的话，无论谁在前，pip 都会去 PyPI 找另一个然后
          # "No matching distribution found"；一条命令里 pip 能同时看到两个
          # 本地路径，环就解开了（python.yml 的矩阵本来就是这么写的）。
          # 本机看不见这件事：两个包早就装过了。
          pip install -e python/ddp_contracts \
                      -e "python/ddp_core[db,cjk,dev]" \
                      -e "services/model-gateway[dev]" \
                      -e services/corpus-worker \
                      -e "services/corpus-api[dev]" \
                      -e "services/mcp[dev]"
          # jsonschema 目前是 mcp SDK 的传递依赖，但 scripts/check_federation_contracts.py
          # 直接依赖它 —— **显式装**，别指望别人的依赖树替我们保证门禁能跑。
          pip install jsonschema

      # 契约生成物过期 = 三种语言的枚举开始漂。
      # gofmt 要在 PATH 上，否则 Go 生成物会格式不一致
      - name: 契约生成物是最新的
        run: python packages/contracts/scripts/generate.py --check

      - name: 契约守卫（契约 ←→ 网关端点）
        run: python scripts/check_contract.py

      - name: 联邦契约（schema ←→ 枚举 ←→ 夹具）
        run: python scripts/check_federation_contracts.py

      - name: 联邦任务路由（契约端点 ←→ corpus-api 实际路由）
        run: python scripts/check_federation_routes.py

      - name: 数据所有权（企业边界 5）
        run: python scripts/check_data_ownership.py

      - name: 块类型判据只有一份且没变
        run: python scripts/check_blocktype_parity.py

      # **这一条以前不在任何 CI 里**，于是它红了四天没人知道
      - name: 分块回归（出处的定位键按块序算）
        run: python scripts/check_chunk_regression.py

      - name: 枚举用法都在契约内
        run: python scripts/check_enum_usage.py

      - name: 日志脱敏（凭据/正文不得进日志）
        run: python scripts/check_log_redaction.py --with-self-test

      - name: control 迁移的两份副本一致
        run: python scripts/check_control_migrations.py

      - name: 配置参考文档与源码同步
        run: python scripts/gen_config_docs.py --check

      - name: 跨服务架构守卫
        run: python -m pytest -q
