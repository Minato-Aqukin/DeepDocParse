[project]
name = "ddp-corpus-worker"
version = "1.0.0"
description = "DeepDocParse 语料 worker：编译 / 索引 / 抽取 / 知识生成 / 对象回收"
requires-python = ">=3.11"
dependencies = [
    # worker 与 API 共用同一份业务实现 —— **不是复制品**。
    # 两边各写一份的后果在这个项目里已经证明过三次（plan.md §1）
    "ddp-corpus-api",
    "ddp-core[db]",
    "ddp-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "aiosqlite>=0.20"]

[project.scripts]
ddp-corpus-worker = "ddp_worker.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["../../tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddp_worker"]
