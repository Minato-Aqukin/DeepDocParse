[project]
name = "ddp-corpus-worker"
version = "1.0.0"
description = "DeepDocParse 语料 worker：编译 / 索引 / 抽取 / 知识生成 / 对象回收"
requires-python = ">=3.11"
dependencies = [
    # worker 与 API 共用同一份业务实现 —— **不是复制品**。
    # 两边各写一份的后果在这个项目里已经证明过三次（plan.md §1）
    "ddp-corpus-api",
    "ddp-core[db]",
    "ddp-contracts",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "aiosqlite>=0.20"]

[project.scripts]
ddp-corpus-worker = "ddp_worker.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# **"." 必须在最前，而且不能省。**
# 各包的 tests/ 都没有 __init__.py，于是 `tests` 是一个**隐式命名空间包**，
# 横跨 ddp_core / corpus-api / corpus-worker 等好几个 tests 目录 ——
# `from tests.conftest import ...` 解析到哪一个，取决于 sys.path 顺序。
#
# 而顺序取决于**怎么起 pytest**：`python -m pytest` 会把 CWD 放进 sys.path
# （所以本机一直是对的），裸 `pytest` 入口脚本**不会** ——
# 那时只剩几个可编辑安装的路径，谁先谁赢。CI 跑的正是裸 pytest，
# 于是 corpus-api 的用例导入到了 ddp_core 的 conftest：
#   ImportError: cannot import name 'CHAT' from 'tests.conftest'
#                (.../python/ddp_core/tests/conftest.py)
#
# 加这一行之后两种起法都对。别删。
pythonpath = [".", "../../tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddp_worker"]
