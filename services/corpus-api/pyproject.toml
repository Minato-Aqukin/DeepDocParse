[project]
name = "ddp-corpus-api"
version = "1.0.0"
description = "DeepDocParse 语料 API：文档 / evidence / citation / 检索 / 问答 / 抽取 / 知识"
requires-python = ">=3.11"
dependencies = [
    # 语料侧要 ORM，所以是带 [db] 的那一层
    "ddp-core[db]",
    "ddp-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "minio>=7.2",
    "pydantic-settings>=2.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21",
    "aiosqlite>=0.20",          # 单测走 SQLite in-memory，不需要 PG
    # **只在 dev 里依赖 worker**（运行时依赖方向是 worker -> api，不成环）。
    # 理由：索引与抽取现在排在持久队列里，测试要能把队列跑干净。
    # 用 worker 真正的 handler 表而不是在 conftest 里另抄一份 ——
    # 抄一份的话，worker 少注册一种任务时测试照样绿
    "ddp-corpus-worker",
]

# **这里没有 python-jose / bcrypt / passlib。** 用户凭据的校验整体迁去
# services/control-api（Go）—— corpus-api 只信任入口下发的 actor 上下文头，
# 自己不认识密码、不签 JWT、不验 API key。少一份密码学实现就少一处出错面。

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["../../tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddp_corpus"]
