[project]
name = "ddp-model-gateway"
version = "1.0.0"
description = "DeepDocParse 模型网关：注册表驱动的协议适配 / 鉴权 / metrics"
requires-python = ">=3.11"
dependencies = [
    "ddp-core",
    "ddp-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "redis>=5.0",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "prometheus-fastapi-instrumentator>=7.0",
    # TODO(阶段 worker)：任务真相搬到 PG job 表后删掉 arq（见 INVENTORY.md §4）。
    # 现在还留着，是为了让重组后的树先有一个可验证的绿基线
    "arq>=0.26",
    # born-digital 兜底解析引擎（无 GPU 时抽 PDF 文字层 + 坐标）。
    # 不是模型，是 PDF 库 —— 铁律 3 禁的是 import 模型代码，不是禁止解析 PDF 结构
    "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21", "fakeredis>=2.26"]

# **这里故意没有 `ddp-core[db]`。** 网关是无状态适配层，一行 ORM 都不该 import；
# 理由与失守后的表现见 python/ddp_core/pyproject.toml 里那段说明。
# `tests/test_minimal_deps.py` 用导入图静态钉着它，CI 另有一个真装最小集的 job。

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# **"." 必须在最前，而且不能省。**
# 各包的 tests/ 都没有 __init__.py，于是 `tests` 是一个**隐式命名空间包**，
# 横跨 ddp_core / corpus-api / corpus-worker 等好几个 tests 目录 ——
# `from tests.conftest import ...` 解析到哪一个，取决于 sys.path 顺序。
#
# 而顺序取决于**怎么起 pytest**：`python -m pytest` 会把 CWD 放进 sys.path
# （所以本机一直是对的），裸 `pytest` 入口脚本**不会** ——
# 那时只剩几个可编辑安装的路径，谁先谁赢。CI 跑的正是裸 pytest，
# 于是 corpus-api 的用例导入到了 ddp_core 的 conftest：
#   ImportError: cannot import name 'CHAT' from 'tests.conftest'
#                (.../python/ddp_core/tests/conftest.py)
#
# 加这一行之后两种起法都对。别删。
pythonpath = [".", "../../tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddp_gateway"]
