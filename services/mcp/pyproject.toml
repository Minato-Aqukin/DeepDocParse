[project]
name = "deepdocparse-mcp"
version = "0.1.0"
description = "语料级 MCP：检索、问答、证据、Wiki 与知识图谱"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "rank-bm25>=0.2",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pgvector>=0.3",
    "minio>=7.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py", "corpus.py"]
