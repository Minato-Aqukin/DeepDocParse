[project]
name = "ddp-mcp"
version = "1.0.0"
description = "DeepDocParse 语料级 MCP：search / ask / get_evidence / read_wiki / graph_neighbors"
requires-python = ">=3.11"
dependencies = [
    # MCP 是**语料消费方**（铁律 6），所以装的是带 ORM 的那一层
    "ddp-core[db]",
    "ddp-contracts",
    "fastmcp>=2.0",
    "httpx>=0.27",
    "pillow>=10.0",
    "pypdfium2>=4.30",
    "rank-bm25>=0.2",
    "redis>=5.0",
    "asyncpg>=0.29",
    "minio>=7.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "respx>=0.21"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["../../tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ddp_mcp"]
