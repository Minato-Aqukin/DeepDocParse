# monorepo 的 Python 工具入口。**不是发行包** —— 四个 Python 包各有自己的
# pyproject.toml，这里只放跨包共用的工具配置与 workspace 声明。
[tool.uv.workspace]
members = [
    "python/ddp_contracts",
    "python/ddp_core",
    "services/model-gateway",
    "services/corpus-api",
    "services/corpus-worker",
    "services/mcp",
]

# 合仓前这层依赖靠"先装 gateway 再装 backend"的口头约定表达，
# 装错顺序的表现是 ModuleNotFoundError（好的那种）或**导入错包**（坏的那种）。
# 现在由 workspace 显式声明，pip/uv 都能解。
#
# **六个成员一个都不能少。** 只写了两个的话 uv 不是"少解一点"，而是**整个
# workspace 拒绝解析**：
#   `ddp-corpus-worker` is included as a workspace member, but is missing
#   an entry in `tool.uv.sources`
# 2026-09-03 在真机部署上撞到 —— 在那之前这段声明从没有被任何工具读过
# （门禁与 CI 都走 pip 装各个包，pip 不认 workspace），
# 于是"pip/uv 都能解"这句话在 uv 那半边一直是假的。
[tool.uv.sources]
ddp-contracts = { workspace = true }
ddp-core = { workspace = true }
ddp-model-gateway = { workspace = true }
ddp-corpus-api = { workspace = true }
ddp-corpus-worker = { workspace = true }
ddp-mcp = { workspace = true }

# 仓库根的 pytest：只跑跨服务的架构守卫（tests/）。
# 各包有自己的 rootdir 与 testpaths，互不干扰。
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# **这份配置以前没人跑。** 门禁、五条工作流、各包 pyproject 里一次
# `ruff` 调用都没有，而代码里有四十来处 `# noqa` 写给这个从不运行的
# linter 看 —— 看起来 lint 有人管，实际没有。两轮独立验收都指出了这一点。
#
# 现在 `scripts/check.sh` 与 CI 真的跑它，但**只跑会抓 bug 的那两族**：
#   F = pyflakes（未定义名、未使用变量这种真错误）
#   B = bugbear（闭包捕获循环变量、blind except 这种真陷阱）
#
# `E`/`W`/`I`/`UP` 仍然留在 select 里给编辑器用，但**不进门禁**
# （见 [tool.ruff] 下面那段）：全仓 183 处，绝大多数是导入顺序与行宽，
# 一次性改完会把这次重构的 diff 淹掉，而它们一个 bug 都抓不到。
# 要收的话另起一次提交，别混在功能改动里。
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["B008"]   # FastAPI 的 Depends() 就是默认参数里调用函数

[tool.ruff.lint.per-file-ignores]
# **B023 只在这一个文件豁免，不全局关。**
# `layout_to_chunks` 的 `emit` 闭包捕获了 `page_idx` / `page_size` ——
# 逐个核过：`emit` 每轮循环重新定义、只在本轮内被调用（`flush` 也是），
# 不存在延迟执行，所以这里是真阳性模式、假告警。
#
# 全局 `--ignore B023` 的话，**别处真出现一个延迟执行的闭包就没人拦了** ——
# 而那正是这条规则唯一值得存在的理由。按文件豁免保住了其余全仓的覆盖。
"python/ddp_core/ddp_core/chunking.py" = ["B023"]

