# 契约测试 + 契约守卫。两套测试都是纯进程内的（respx mock 上游 + fakeredis），
# 不需要 GPU、不需要容器 —— 所以 CI 的成本近乎为零，没有理由不挂。
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 下面的铁律 4 检查要和 base 比 diff

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e "gateway[dev]"
          pip install -e mcp_server

      # testpaths 是 ../tests，必须在 gateway/ 下跑
      - name: 契约测试
        working-directory: gateway
        run: pytest -q

      - name: 契约守卫（openapi.yaml ←→ gateway 实际端点）
        run: python scripts/check_contract.py

      # 生成的文档不会自动腐烂，前提是有人盯着。这一步就是那个人
      - name: 配置参考文档与 config.py 同步
        run: python scripts/gen_config_docs.py --check

      # 铁律 4 的机械保障：契约冻结在 v1.0，改 /v1/* 的行为必须先改契约文件。
      # 只在 PR 上跑 —— push 到 main 时没有稳定的比较基准。
      # 纯重构（对外行为零变化）加 no-contract-change 标签跳过 —— 逃生口要显式且留痕
      - name: 铁律 4：动了 /v1/* 实现就必须动 openapi.yaml
        if: >-
          github.event_name == 'pull_request' &&
          !contains(github.event.pull_request.labels.*.name, 'no-contract-change')
        run: |
          base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          changed=$(git diff --name-only "$base" HEAD)
          echo "$changed" | sed 's/^/  /'
          routers=$(echo "$changed" | grep -E '^gateway/app/routers/' || true)
          contract=$(echo "$changed" | grep -E '^openapi\.yaml$' || true)
          if [ -n "$routers" ] && [ -z "$contract" ]; then
            echo "::error::改了 gateway/app/routers/ 但没有改 openapi.yaml。"
            echo "::error::铁律 4：/v1/* 的行为以契约为准，先改契约再改实现。"
            echo "::error::确属纯重构（对外行为零变化）就给 PR 加 no-contract-change 标签。"
            exit 1
          fi
