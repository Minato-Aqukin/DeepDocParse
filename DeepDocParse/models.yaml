# 模型注册表 —— service 扩展模型的唯一入口
# 原则：gateway 不 import 任何模型代码，只查此表转发。
# 加模型 = 在 docker compose 加一个容器 + 在这里加一行。
#
# 内部只认两种标准协议：
#   1. OpenAI 协议（vqa_models / embedding_models）
#   2. mineru-api 任务协议（parse_engines）
# endpoint 主机名 = docker compose 服务名。

vqa_models:
  deepseek-ocr:
    endpoint: "http://vqa-dsocr:8000"
    default: true
  # 扩展示例（去注释 + compose 加容器即可）：
  # qwen3-vl:
  #   endpoint: "http://vqa-qwen:8000"
  # paddleocr-vl:                       # deepseek-ocr.rs 多后端本身支持
  #   endpoint: "http://vqa-paddle:8000"

parse_engines:
  mineru:
    # dev: 直连单个 mineru-api worker；prod: 指向 mineru-router（接口完全兼容，只改 URL）
    endpoint: "http://mineru:8000"
    default: true
    runtime: mineru-api          # 用哪个适配器说话（见 gateway/app/services/engines.py）
    # 引擎默认选项（请求方 options 可覆盖）：
    # dev 镜像只内置 pipeline 模型（8GB 卡）；prod vlm 后端时改 backend 并删本行注释
    options:
      backend: pipeline

  # 无 GPU 兜底：有文字层的 PDF 直接用 pypdfium2 抽文字层 + 坐标，进程内跑，
  # 不需要容器也不需要下模型。**不覆盖**扫描件/表格结构/公式/分栏顺序 —— 那是 mineru 的活。
  # 它同时是"加引擎 = 加容器 + 一行配置"的第一个真实验证（在此之前只有 mineru 一个引擎）。
  borndigital:
    endpoint: "inproc://borndigital"    # 进程内引擎，没有远端地址
    runtime: borndigital
    capabilities: [parse]

  # v1.1：用视觉语言模型做整页识别（「基于大语言模型的文字识别」这条线）。
  # endpoint **就是 vqa_models 那个容器** —— 同一个 endpoint 可以同时出现在两个段里，
  # 不需要为解析再起一个。加这个引擎没有改动 engines.py 的任何既有代码。
  # 定位：扫描件兜底 + LLM 识别路线的对照组，不是 mineru 的替代
  #   （一页一次模型调用，长文档很贵；bbox 靠模型自报，精度不如版面模型）
  vlm-ocr:
    endpoint: "http://vqa-dsocr:8000"
    runtime: vlm-ocr
    capabilities: [parse, vision]
    options:
      model: deepseek-ocr     # **必填**：缺它时运行时会自己挑一个，识别质量无从复现
      scale: 2.0              # 页面渲染倍率（72dpi 基准）
      concurrency: 2          # 同时打几页，受显存约束

# ---- v2（M4）：注册即启用分块索引链与向量检索；删除本段则全链路回退 BM25 ----
embedding_models:
  bge-m3:
    endpoint: "http://embed:8080"     # TEI (text-embeddings-inference) 容器
    default: true
    runtime: tei                      # 决定取得到哪些头：TEI 只给 dense
    capabilities: [dense]             # bge-m3 本身还有 sparse/colbert 头，但 TEI 取不到

# ---- v1.1：交叉编码器重排（/v1/rerank）。**删掉本段 = 不重排**，
# 调用方会拿到 404 并打一个可见的降级标记（不是静默跳过）。
# TEI 原生支持 /rerank，与上面的 embed 是同一类容器换个 model —— 几乎零新增运维面。
# **缺省注释掉**：/readyz 是 all(up)，注册了却没起对应容器会让探针恒 503，
# 而 compose.dev.yml 里没有 rerank 服务（只有 compose.prod-nvidia.yml 有）。
# 上精排时把这段和 compose 里的 rerank 服务一起打开。
# rerank_models:
#   bge-reranker-v2-m3:
#     endpoint: "http://rerank:8080"    # TEI 容器，--model-id BAAI/bge-reranker-v2-m3
#     default: true
#     runtime: tei
#     capabilities: [rerank]
