openapi: 3.1.0
info:
  title: DeepDocParse API
  version: 1.0.0
  description: |
    DeepDocParse 对外契约。DeepDocParse-Web/backend 只依赖本文件。
    鉴权：所有请求携带 `Authorization: Bearer <SERVICE_TOKEN>`（内网 service token，非用户 key）。

    **v1.0 已冻结（M5）**：此后只允许向后兼容的新增（新增可选字段/新增端点），
    不得删改既有字段语义。最后一次不兼容变更是 `/v1/parse` 增加可选 `doc_id`（ADR #11）。

    **v1.1（2026-08-23）新增**：`/v1/extract*` 抽取平面、`/v1/rerank`。
    两者都是纯新增端点，既有调用方一字不用改。版面结果 `layout_json` 同步把
    `para_blocks[].type` 升进承诺字段（见 docs/layout-format.md），也是向后兼容的加法。

servers:
  - url: http://DeepDocParse:9000

paths:
  /v1/parse:
    post:
      summary: 提交文档解析任务（异步）
      operationId: submitParse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [file_url]
              properties:
                file_url:
                  type: string
                  description: 文件的可下载 URL（backend 侧生成），不传文件流
                doc_id:
                  type: string
                  description: |
                    稳定文档标识，**必须用文件内容 sha256 等高熵值**。缺省则回退为 sha256(file_url)。
                    service 用它做任务幂等复用与向量索引分块键——URL 每次变化（预签名/临时链接）
                    时必须传本字段，否则同一文档会被重复解析且检索缓存永不命中。
                    注意：service 不感知用户，doc_id 的去重是**跨调用方全局生效**的；
                    传低熵值（如 "doc1"）会让不同调用方读到彼此的解析结果。
                engine:
                  type: string
                  description: |
                    解析引擎，见 models.yaml parse_engines。**缺省取注册表里标了 default 的那条**，
                    而不是固定的 "mineru" —— 无 GPU 部署（models.cpu.yaml）注册的是 borndigital。
                    这是向后兼容的放宽：注册了 mineru 为 default 的部署行为不变。
                options:
                  type: object
                  description: 引擎透传选项（如 mineru 的 backend=pipeline|vlm、语言等）
                callback_url:
                  type: string
                  description: 可选。任务完成后 gateway 回调 backend
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
        "429":
          description: 队列已满，backend 应限流重试

  /v1/parse/{task_id}:
    get:
      summary: 查询任务状态
      operationId: getParseStatus
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  status: { type: string, enum: [pending, running, succeeded, failed] }
                  progress: { type: number, description: 0-1 }
                  error: { type: string, nullable: true }
                  doc_hash:
                    type: string
                    nullable: true
                    description: |
                      文档身份（v2 向量索引的分块键）。等于 sha256(doc_id) 或 sha256(file_url)，
                      取决于提交时是否带了 doc_id。只拿得到裸 URL 的调用方必须用本字段，
                      自己哈希 URL 会算出不同的键、检索永远零命中。

  /v1/parse/{task_id}/result:
    get:
      summary: 获取解析结果（暂存 24h，backend 需及时取回归档）
      operationId: getParseResult
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  markdown: { type: string }
                  layout_json:
                    type: object
                    description: >
                      版面结构（DDP-Layout v1）：页码 + bbox + 块文本，出处定位与
                      v2 分块索引的数据源。字段清单与坐标系见 docs/layout-format.md ——
                      **只有那份文档里列出的字段才在契约内**，引擎附带的其它字段
                      （type/index/angle 等）不保证跨引擎存在。
                  images:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        url: { type: string, description: 图片下载地址 }

  /v1/chat/completions:
    post:
      summary: VQA 平面（OpenAI Chat Completions 协议，支持流式）
      description: |
        完全遵循 OpenAI 协议：messages 支持 image_url content part。
        model 字段路由到 models.yaml vqa_models；缺省用 default 模型。
        gateway 透传到对应运行时（deepseek-ocr.rs / vLLM）。
      operationId: chatCompletions
      responses:
        "200": { description: OpenAI 兼容响应（含 SSE 流式） }

  /v1/models:
    get:
      summary: 列出可用模型（OpenAI 协议），来源 models.yaml
      operationId: listModels
      responses:
        "200": { description: OpenAI 兼容模型列表 }

  /v1/embeddings:
    post:
      summary: 向量化（OpenAI Embeddings 协议，v2/M4 启用）
      description: |
        完全遵循 OpenAI 协议：input 为 string 或 string[]。
        model 字段路由到 models.yaml embedding_models；缺省用 default 模型。
        gateway 透传到对应运行时（TEI）。内部消费方：worker 分块索引、ask_document 检索。
      operationId: createEmbeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  oneOf:
                    - { type: string }
                    - { type: array, items: { type: string } }
                model: { type: string, description: 缺省用注册表 default }
      responses:
        "200": { description: "OpenAI 兼容 embeddings 响应（data[].embedding）" }
        "404": { description: 未注册的 model }
        "502": { description: embedding 运行时不可达 }

  /v1/extract:
    post:
      summary: 结构化抽取平面（异步任务，v1.1 新增）
      description: |
        给一份文档 + 一个受限 JSON Schema，抽出符合 schema 的结构化数据，
        **每个字段带页码 + bbox + 稳定定位键的出处**。格式见 docs/extract-format.md。

        与问答平面的关系：问答是「问题进、自然语言答案出」，抽取是「schema 进、记录出」。
        两者共用同一条定位链路（检索 -> 定位 -> 裁剪 -> 视觉核对），因此出处形状完全一致。

        **实现约束（写进契约，避免被换成黑箱实现）**：字段值必须走
        「先检索定位到块 -> 再从块里抽值」，不许把全文塞进 prompt 让模型直接吐 JSON ——
        后者出处只能靠事后字符串匹配倒推，会产出带着"已验证"标记的假出处。
      operationId: submitExtract
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [schema]
              properties:
                file_url:
                  type: string
                  description: 文件的可下载 URL。与 doc_hash 二选一（都给时 doc_hash 优先）
                doc_hash:
                  type: string
                  description: |
                    已解析文档的身份（`/v1/parse/{id}` 响应里的 doc_hash）。
                    给了它就直接用已有的解析缓存与向量索引，不重新解析 —— 批量抽取必须走这条。
                doc_id:
                  type: string
                  description: 同 /v1/parse 的 doc_id；只在需要触发解析时使用
                schema:
                  type: object
                  description: |
                    受限 JSON Schema。支持顶层 object（单记录）或 array（多记录/表格）；
                    叶子字段必须带 description（它同时是检索 query）。
                    不支持嵌套 object / oneOf / $ref，详见 docs/extract-format.md
                engine:
                  type: string
                  description: 需要触发解析时用哪个引擎，缺省取注册表 default
                options:
                  type: object
                  description: 抽取选项（max_records、verify 等）
                callback_url:
                  type: string
                  description: 可选。抽取完成后 gateway 回调
      responses:
        "202":
          description: 已受理
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  status:
                    type: string
                    enum: [pending, running]
                    description: 文档尚未解析时先触发解析，此处为 pending
        "400": { description: schema 不合法（不支持的构造、字段缺 description 等） }
        "429": { description: 队列已满 }

  /v1/extract/{task_id}:
    get:
      summary: 查询抽取任务状态
      operationId: getExtractStatus
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                properties:
                  task_id: { type: string }
                  status: { type: string, enum: [pending, running, succeeded, failed] }
                  progress: { type: number, description: 0-1，按已完成字段数算 }
                  error: { type: string, nullable: true }
                  doc_hash: { type: string, nullable: true }
        "404": { description: 任务不存在 }

  /v1/extract/{task_id}/result:
    get:
      summary: 获取抽取结果（DDP-Extract v1，暂存 24h）
      operationId: getExtractResult
      parameters:
        - { name: task_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: |
            DDP-Extract v1。字段三态 found / not_found / error 必须区分对待：
            not_found 表示"文档里确实没有"，是正确答案的一种；error 才是系统问题。
            完整字段清单见 docs/extract-format.md
          content:
            application/json:
              schema:
                type: object
                properties:
                  extract_version: { type: string, const: ddp-extract/1 }
                  doc_hash: { type: string }
                  status: { type: string, enum: [ok, partial, failed] }
                  degraded:
                    type: string
                    nullable: true
                    enum: [no_hits, embedding_unavailable, vision_unavailable,
                           crop_unsupported, crop_failed, parse_mismatch,
                           upstream_error, schema_violation, rerank_unavailable,
                           no_instruct_model]
                  fields:
                    type: object
                    description: 顶层 schema 是 object 时的字段表
                    additionalProperties:
                      type: object
                      properties:
                        status: { type: string, enum: [found, not_found, error] }
                        value: { nullable: true }
                        citations: { type: array, items: { type: object } }
                        verified: { type: boolean }
                        degraded: { type: string, nullable: true }
                        confidence: { type: object }
                  records:
                    type: array
                    description: 顶层 schema 是 array 时的记录数组
                    items: { type: object }
                  usage: { type: object }
        "409": { description: 结果尚未就绪，先查状态 }

  /v1/rerank:
    post:
      summary: 重排序（交叉编码器，v1.1 新增）
      description: |
        查询 + 候选文档 -> 按相关度重排。路由到 models.yaml 的 rerank_models 段，
        协议对齐 TEI 的 /rerank（`{query, texts}` 进，`[{index, score}]` 出）。

        内部消费方：抽取平面的字段定位、问答平面的候选精排。
        **未注册 rerank_models 时返回 404**，调用方据此退回不重排（可见降级，不是静默跳过）。
      operationId: rerankDocuments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query, texts]
              properties:
                query: { type: string }
                texts: { type: array, items: { type: string } }
                model: { type: string, description: 缺省用注册表 default }
                top_n: { type: integer, description: 只返回前 N 条，缺省全返回 }
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    index: { type: integer, description: 在入参 texts 里的下标 }
                    score: { type: number }
        "404": { description: 未注册 rerank 模型 }
        "502": { description: rerank 运行时不可达 }

  /healthz:
    get:
      summary: 存活探针
      responses:
        "200": { description: ok }

  /readyz:
    get:
      summary: 就绪探针（检查 Redis 与各引擎连通性）
      responses:
        "200": { description: ready }
        "503": { description: 依赖未就绪 }
