openapi: 3.1.0
info:
  title: DeepDocParse Managed Discovery Control API
  version: 1.0.0
  description: |
    See ../ddp/discovery-control-format.md. Control owns node identity, approvals and
    per-caller persistent directory snapshots. Peer reads expose only the approved,
    organization-visible direct directory (single-use signed node credentials); recursive
    expansion, budgets and loop detection live in the scope collector, not here.
    No scanning, address probing or user-credential forwarding is provided.
    Approved direct members are renewed by directory pull, not peer push: every
    60 seconds by default (configurable 1..120), at most four concurrent two-second
    reads of the public node endpoint derived only from the approved federation
    endpoint, with no redirects or environment proxy. The signed descriptor must
    match the approved identity, public key, revision and configuration. Pending
    and revoked members are never renewed. Failed attempts use persistent capped
    exponential backoff and never extend valid_until; expired leases stay expired.
    Existing snapshots retain their frozen expiry. Renewal outcomes are persisted
    on the member row and logged; descriptor freshness is not admission readiness.
    A short poll (at most one second) is independent of the per-member interval;
    full batches are drained immediately before sleeping. Renewed leases must be
    whole-second UTC instants no later than ten minutes from the observation
    (five-minute publisher TTL plus a bounded clock-skew allowance).
security: [{session: []}, {userKey: []}]
paths:
  /api/v1/federation/generation-candidates:
    get:
      operationId: listGenerationCandidates
      description: |
        Ordinary authenticated users may read approved, unexpired direct members visible
        to their organization or subject. No task, query, resource identifiers or user
        credentials are sent to peers. Only administrator-configured endpoints are
        contacted, using single-use signed node credentials. Missing, unreachable,
        invalid or expired observations remain unknown and never accept admissions.
        Members whose fresh complete observation lacks the requested operation are omitted.
        Observations use at most four concurrent peers with a two-second per-peer timeout
        inside a five-second overall window; an unobserved peer remains unknown.
        This is discovery only, not a reservation or executor selection.
      parameters:
        - name: operation
          in: query
          required: true
          schema: {$ref: '#/components/schemas/GenerationOperation'}
      responses:
        '200': {description: Fresh visible candidates with per-operation observations, content: {application/json: {schema: {$ref: '#/components/schemas/GenerationCandidates'}}}}
        '400': {description: Missing, duplicate or unsupported operation; other query parameters rejected}
        '401': {description: Authentication required}
        '403': {description: Read scope required}
  /api/v1/federation/generation-descriptor:
    get:
      operationId: readPeerGenerationDescriptor
      security: [{nodeCredential: []}]
      x-ddp-node-credential-operation: directory_capabilities_read
      description: |
        Payload-free capability observation from the configured local corpus producer.
        Authenticated approved peers only; issuer, receiver, route and empty query are
        covered by the single-use signature. Contains no user or task identity.
      responses:
        '200': {description: Current local generation observations or honest unknown, content: {application/json: {schema: {$ref: '#/components/schemas/GenerationDescriptor'}}}}
        '400': {description: invalid_generation_descriptor — query parameters are not accepted}
        '401': {description: Invalid, expired or replayed node credential}
        '403': {description: Unapproved issuer or credential scope mismatch}
        '409': {description: wrong_target — receiver identity differs from the authenticated target}
        '503': {description: node_identity_unavailable or credential_store_unavailable}
  /api/v1/federation/members:
    get:
      operationId: readPeerDirectoryMembers
      security: [{nodeCredential: []}]
      x-ddp-node-credential-operation: directory_members_read
      description: |
        Node-level read of this directory's approved, organization-visible direct members.
        A trusted, approved issuer must sign for this receiver, operation and canonical
        query digest. Hidden, pending and unauthorized members never appear.
        Descriptor keys and sharing lists never leave the node. Pages are
        a persistent frozen snapshot: continuation must pass snapshot_id and cursor, and
        limit cannot change. An omitted continuation limit retains the snapshot's page size,
        not the first-request default. Requesting the terminal cursor returns an empty complete page.
      parameters:
        - {name: snapshot_id, in: query, schema: {type: string, maxLength: 128}, description: Omitted on the first request only; a cursor without it is rejected}
        - {name: cursor, in: query, schema: {type: string, maxLength: 128}, description: Opaque cursor bound to the frozen peer snapshot}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}, description: First-request page size only}
      responses:
        '200': {description: Stable member page with a separate empty terminal proof, content: {application/json: {schema: {$ref: '#/components/schemas/PeerMemberPage'}}}}
        '400': {description: Invalid page options or cursor without snapshot_id}
        '401': {description: 'credential_invalid, credential_expired or credential_replayed'}
        '403': {description: 'node_unknown, node_revoked, credential_audience_mismatch or credential_scope_denied'}
        '409': {description: wrong_target; X-DDP-Target-Node names another node}
        '410': {description: Peer snapshot expired; create a new one}
  /api/v1/federation/node:
    get:
      operationId: inspectAuthorityNode
      security: []
      parameters:
        - name: challenge
          in: query
          schema: {type: string, pattern: '^[A-Za-z0-9_-]{32,64}$'}
          description: Canonical raw base64url nonce; optional, requested proof binds configured public base URL.
      description: |
        Publishes a publisher_signature over the complete descriptor (see
        discovery-control-format.md). Directories verify it against the approved
        public key before renewing an unchanged lease.
      responses:
        '200': {description: Public identity, no workspace or user; challenge returns 60-second key-possession proof, content: {application/json: {schema: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/NodeHandshake'}}}}
        '400': {description: Invalid or duplicate challenge}
        '503': {description: Persistent identity unavailable}
  /api/v1/capabilities:
    get:
      operationId: authenticatedCapabilities
      responses:
        '200': {description: Authenticated identity/profile and actually observed capabilities, content: {application/json: {schema: {$ref: '#/components/schemas/Handshake'}}}}
        '401': {description: Missing, expired or revoked credentials}
        '403': {description: Key lacks read scope or account disabled}
  /api/v1/client/handshake:
    get:
      operationId: clientHandshake
      description: Exact alias of authenticatedCapabilities; unimplemented client projections are absent from capabilities.
      responses:
        '200': {description: Authenticated capabilities, content: {application/json: {schema: {$ref: '#/components/schemas/Handshake'}}}}
        '401': {description: Authentication required}
  /api/v1/federation/capabilities:
    get:
      operationId: federationCapabilities
      description: Exact alias of authenticatedCapabilities; admission remains disabled.
      responses:
        '200': {description: Authenticated capabilities, content: {application/json: {schema: {$ref: '#/components/schemas/Handshake'}}}}
        '401': {description: Authentication required}
  /api/v1/federation/nodes:
    get:
      operationId: adminListNodes
      security: [{session: []}]
      responses:
        '200': {description: Administrator directory with config, health and admission separated}
        '403': {description: Administrator session required}
    post:
      operationId: adminRegisterNode
      description: |
        New configurations enter pending approval. A same-revision lease renewal is
        accepted only when the public key, descriptor configuration and local sharing
        scope are unchanged and valid_until strictly increases. Renewal preserves the
        existing approval and authorization revision; it cannot revive a revoked node
        or mutate a frozen member snapshot. Stale or changed same-revision inputs fail.
      security: [{session: []}]
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/DirectoryRegistration'}}}
      responses:
        '201': {description: Registered metadata or renewed unchanged lease; state reports the actual approval state, not health}
        '400': {description: Invalid identity, protocol or endpoint}
        '403': {description: Administrator session required}
        '404': {description: Sharing subject not in organization}
        '409': {description: Stale revision or revoked identity}
  /api/v1/federation/nodes/{node_id}/approve:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: adminApproveNode
      security: [{session: []}]
      responses:
        '200': {description: Approved configuration, not proof of health or node credential}
        '403': {description: Administrator session required}
        '404': {description: Node unavailable}
        '409': {description: Expired descriptor or revoked node}
  /api/v1/federation/nodes/{node_id}/revoke:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    post:
      operationId: adminRevokeNode
      security: [{session: []}]
      responses:
        '200': {description: Revoked idempotently; old snapshot member preserved}
        '403': {description: Administrator session required}
        '404': {description: Node unavailable}
  /api/v1/federation/member-snapshots:
    post:
      operationId: createMemberSnapshot
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                page_size: {type: integer, minimum: 1, maximum: 100, default: 50}
                ttl_seconds: {type: integer, minimum: 30, maximum: 3600, default: 900}
      responses:
        '201': {description: Frozen visible member set, content: {application/json: {schema: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/MemberSnapshot'}}}}
        '400': {description: Invalid options or client-supplied caller scope}
        '401': {description: Authentication required}
  /api/v1/federation/member-snapshots/{snapshot_id}/members:
    parameters:
      - {name: snapshot_id, in: path, required: true, schema: {type: string}}
      - {name: cursor, in: query, schema: {type: string}, description: Opaque cursor bound to snapshot and caller; omitted starts first page}
    get:
      operationId: readMemberSnapshotPage
      responses:
        '200': {description: Stable page, terminal cursor returns empty complete page, content: {application/json: {schema: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/MemberSnapshotPage'}}}}
        '404': {description: Snapshot, caller scope or cursor mismatch; no hidden counts}
        '410': {description: scope_expired; create a new scope instead of joining directory revisions}
  # ------------------------------------------------ internal: node credentials (ddp-node-credential/1)
  # Only the local corpus service and worker call these, with the internal service credential.
  # Control is the single owner of the node private key (invariant 5): corpus never sees the seed.
  /internal/federation/identity:
    get:
      operationId: internalNodeIdentity
      security: [{service: []}]
      description: |
        This autonomous centre's persistent node identity. corpus-api and corpus-worker bind their
        federation identity to it at startup; a configured BUNDLE_NODE_ID that differs fails closed
        (node_identity_mismatch) instead of running with two identities.
      responses:
        '200': {description: Persistent identity, content: {application/json: {schema: {$ref: '../schemas/ddp-node-credential/v1.json#/$defs/NodeIdentity'}}}}
        '401': {description: invalid_service_token}
        '503': {description: node_identity_unavailable}
  /internal/federation/node-credentials:
    post:
      operationId: internalIssueNodeCredential
      security: [{service: []}]
      description: |
        Sign one single-use outbound credential for the local corpus service. Control fills issuer,
        issued_at, expires_at and a random 128-bit jti; the caller cannot choose them. Refused when
        the audience is not an approved member of this centre's organization (node_unknown 403 /
        node_revoked 403), is this node itself, the actor belongs to another organization
        (credential_scope_denied 403), or the request violates the SignRequest shape (400
        credential_invalid). Rate limited per audience (429 rate_limited). Every issuance is logged
        with audience, operation, root_task_id and jti; the credential itself is never logged.
      requestBody: {required: true, content: {application/json: {schema: {$ref: '../schemas/ddp-node-credential/v1.json#/$defs/SignRequest'}}}}
      responses:
        '200': {description: Signed credential, content: {application/json: {schema: {$ref: '../schemas/ddp-node-credential/v1.json#/$defs/SignedCredential'}}}}
        '400': {description: credential_invalid}
        '401': {description: invalid_service_token}
        '403': {description: node_unknown / node_revoked / credential_scope_denied}
        '429': {description: rate_limited}
        '503': {description: node_identity_unavailable}
  /internal/federation/peer-keys/{node_id}:
    parameters: [{$ref: '#/components/parameters/NodeId'}]
    get:
      operationId: internalPeerTrust
      security: [{service: []}]
      description: |
        Trust record the receiving corpus service uses to authenticate an inbound credential. Pending
        and revoked members are returned with their state (the verifier refuses them); unregistered
        nodes are 404. organization_id is the local organization that approved the node; remote
        callers act inside it as read-only peer principals under the local resource ACL.
        Responses are never cached by control; the verifier's cache bound is its own documented
        configuration (FEDERATION_PEER_KEY_CACHE_SECONDS).
      responses:
        '200': {description: Trust record, content: {application/json: {schema: {$ref: '../schemas/ddp-node-credential/v1.json#/$defs/PeerTrust'}}}}
        '401': {description: invalid_service_token}
        '404': {description: node_unknown}
        '503': {description: node_identity_unavailable}
components:
  securitySchemes:
    session: {type: http, scheme: bearer, bearerFormat: JWT}
    service: {type: http, scheme: bearer, description: Internal service credential (SERVICE_TOKEN); never a user or node credential}
    userKey: {type: http, scheme: bearer, description: User API key with read scope; never a node credential}
    nodeCredential: {type: apiKey, in: header, name: X-DDP-Node-Credential, description: 'Single-use Ed25519 credential bound to receiver, operation, request and query; live approval and durable replay protection required'}
  parameters:
    NodeId: {name: node_id, in: path, required: true, schema: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/node_id'}}
  schemas:
    GenerationOperation:
      type: string
      enum: [rag.answer.cited, wiki.pages]
    GenerationCandidate:
      type: object
      additionalProperties: false
      required: [node_id, state, descriptor_valid_until, operation, readiness, accepting_admissions]
      properties:
        node_id: {type: string}
        state: {type: string, const: approved}
        descriptor_valid_until: {type: string, format: date-time}
        operation: {$ref: '#/components/schemas/GenerationOperation'}
        readiness: {type: string, x-ddp-enum: capability_readiness}
        accepting_admissions: {type: boolean, description: True only for a fresh ready producer observation explicitly accepting this operation}
        observed_at: {type: string, format: date-time}
        valid_until: {type: string, format: date-time}
    GenerationCandidates:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/GenerationCandidate'}}
    GenerationDescriptor:
      type: object
      additionalProperties: false
      required: [node_id, profiles, capability_status]
      properties:
        node_id: {type: string}
        profiles: {type: array, items: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/CapabilityProfile'}}
        capability_status: {type: string, enum: [observed, unknown]}
    PeerMemberPage:
      type: object
      additionalProperties: false
      required: [authority_node_id, snapshot_id, registry_revision, created_at, expires_at, first_cursor, terminal_cursor, members, next_cursor, complete]
      properties:
        authority_node_id: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/node_id'}
        snapshot_id: {type: string, minLength: 1, maxLength: 128}
        registry_revision: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        first_cursor: {type: string, minLength: 1}
        terminal_cursor: {type: string, minLength: 1}
        members: {type: array, maxItems: 100, items: {$ref: '#/components/schemas/PeerMember'}}
        next_cursor: {type: [string, 'null']}
        complete: {type: boolean}
    PeerMember:
      type: object
      additionalProperties: false
      required: [node_id, descriptor_revision, valid_until, endpoints, state, health, accepting_admissions, expansion_state]
      properties:
        node_id: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/node_id'}
        descriptor_revision: {type: integer, minimum: 0}
        valid_until: {type: string, format: date-time}
        endpoints:
          type: array
          maxItems: 8
          items:
            type: object
            additionalProperties: false
            required: [purpose, url]
            properties:
              purpose: {type: string, enum: [federation, data_channel]}
              url: {type: string, format: uri}
        state: {type: string, enum: [approved, revoked]}
        health: {type: string, enum: [unknown, ready, draining, unhealthy]}
        accepting_admissions: {type: boolean}
        expansion_state: {type: string, enum: [not_requested, unexpanded_subtree, source_revoked]}
    Handshake:
      type: object
      additionalProperties: false
      required: [protocol_version, identity, profile, capabilities, profiles, capability_status, accepting_admissions]
      properties:
        protocol_version: {const: ddp-client/1}
        identity:
          type: object
          additionalProperties: false
          required: [environment_id, authority_node_id, workspace_id]
          properties:
            environment_id: {type: string}
            authority_node_id: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/node_id'}
            workspace_id: {type: string}
        profile:
          type: object
          additionalProperties: false
          required: [issuer, subject]
          properties:
            issuer: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/node_id'}
            subject: {type: string}
        capabilities: {type: array, items: {type: string}, description: Implemented client projection interfaces only}
        profiles: {type: array, items: {$ref: '../schemas/ddp-discovery/v1.json#/$defs/CapabilityProfile'}}
        capability_status: {type: string, enum: [observed, unknown]}
        accepting_admissions: {const: false}
