    post:
      tags: [wiki]
      operationId: createWiki
      summary: 新建版本化 Wiki（写操作，本机源可用，中心源经宿主拒绝）
      description: 同名规划页合并有效引用及章节。跨篇规划和生成结论均须引用全部选定来源，否则拒绝；这不是语义核验。
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 128 } }
      requestBody:
        required: true
