  /api/conversations/{conversation_id}/ask:
    post:
      tags: [qa]
      operationId: ask
      summary: 问答（SSE 流）
      security: [{ session: [] }]
      description: |
        SSE 事件（`routers/conversations.py::_stream_answer` + 前端 `askStream`/`dispatch`）：

        - `meta` → SSEMeta：本轮是否检索、检索到的 chunk 与候选门控。
        - `delta` → SSEDelta：回答文本片段（可多帧拼接）。
        - `citations` → SSECitations：本轮引用的出处（落库形状经 `citation_out`）。
        - `assertions` → SSEAssertions：回答的语义真相（逐条证据绑定；拒绝作答时
          unsupported 为 true，文本为固定 REFUSAL_* 之一）。
        - `done` → SSEDone：终帧。**每一轮都以 done 收尾**（出错也先发 error、落库、再发 done）；
          什么都没说明就结束的流 = 生成中途断了，客户端按 `stream_incomplete` 报。
        - `error` → SSEError：错误（code 如 `schema_violation`、`upstream_unavailable`、
          `upstream_interrupted`、`resource_access_revoked`）。

        结构化答案规则：claims 只绑定本轮供给的 evidence；证据不足时拒绝脱离文档作答，
        不凭常识补答（REFUSAL_NO_EVIDENCE / REFUSAL_INCOMPLETE_EVIDENCE /
        REFUSAL_INSUFFICIENT_EVIDENCE）。

        新事实检索与 /api/search 采用同一有界子问题策略，并按 EMBEDDING_BATCH_SIZE
        分批向量化；逐篇相似度门控、固定来源版本与最终上下文条数不变。
        名额分配与 /api/search 相同：子问题数小于检索 limit 时原问题先占一位，达到或
        超过 limit 时子问题先占位；limit 小于子问题数时只为顺序靠前的 limit 个子问题
        预留名额，不能保证其余子问题进入结果。
        子问题命中不代表已经答全，回答仍须逐条由实际上下文支持。

        原文自动核对通过网关模型清单的 vision 能力独立选路，并使用该模型的
        transcribe_prompt。回答模型退回纯文本不代表核对模型不可用：
        核对通过时 verified=true，不再保留“未做视觉核对”的 vision_unavailable；
        embedding/rerank 等其他真实降级仍保留。核对不可用不得冒充 parse_mismatch。
      parameters:
        - { name: conversation_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question]
              properties:
                question: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        '200': { description: text/event-stream 事件流 }

