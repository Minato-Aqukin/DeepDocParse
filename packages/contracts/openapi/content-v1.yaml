openapi: 3.1.0
info:
  title: DeepDocParse Content API
  version: 1.0.0
  description: |
    Web 前端实际调用的中心内容接口（`services/corpus-api` 的语料面 + control-api
    拥有的三个端点），此前未进任何 OpenAPI 契约。**以 corpus-api 现行实现为准**，
    不改变中心行为。

    ## 入口

    浏览器只跟 control-api 说话（见 control-v1.yaml）：会话鉴权、actor 头下发后，
    `/api/*` 整段转发给 corpus-api。只有三处例外由 control-api 自己实现：

    - `GET /api/auth/me` —— 当前用户（control-api `handleMe`）。
    - `POST /api/uploads`、`GET /api/uploads/{id}`、`POST /api/uploads/{id}/finalize`
      —— 直传上传会话（control-v1.yaml 的 UploadSession，见其 `parts` 预签名）。
    - `GET /api/documents/{id}/download-url` —— 浏览器用的短期下载地址
      （control-api `handleDownloadURL`）。

    其余端点由 corpus-api 实现（`services/corpus-api/ddp_corpus/routers/*.py`），
    经 control-api 的 `corpusPrefixes` 转发。

    ## 错误体

    corpus-api：`{"error": {"message": "...", "type": "...", "code": "..."}}`
    （`ddp_corpus/errors.py` 的 APIError；`code` 是机器可读码如 `document_not_found`）。
    control-api：OpenAI 风格（control-v1.yaml `Error`）。

tags:
  - name: resources
  - name: uploads
  - name: documents
  - name: search
  - name: qa
  - name: evidence
  - name: wiki

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 浏览器会话。`/api/*` 用它。

  parameters:
    ResourceContext:
      name: resource_id
      in: query
      required: false
      schema: { type: string }
      description: |
        同一份字节被多人先后上传时，按选中的资源看它的元数据
        （前端 `ResourceContext`，见 `apps/web/src/api/resource-context.ts`）。
    VersionContext:
      name: version_id
      in: query
      required: false
      schema: { type: string }
      description: 同上，固定版本的身份。

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string, nullable: true }

    ResourceVersion:
      type: object
      required: [id, resource_id, version_no, document_id, source_digest, filename]
      properties:
        id: { type: string }
        resource_id: { type: string }
        version_no: { type: integer }
        document_id: { type: string }
        source_digest: { type: string }
        source_digest_verified: { type: boolean }
        filename: { type: string }
        size_bytes: { type: integer }
        parse_job_id: { type: string, nullable: true }
        parse_status:
          type: string
          description: 取值与文案的唯一来源是 enums.yaml 的 `parse_status`。
        index_status:
          type: string
          description: 取值与文案的唯一来源是 enums.yaml 的 `index_status`。
        federation_input_allowed:
          type: boolean
          description: 本机固定版本作为联邦任务锁定输入的来源权限投影；仅本机源提供。false 表示来源策略拒绝该版本参与联邦任务（包括只锁摘要的问答/Wiki 与外发原件的文件计划）。不是远端授权凭证；批准与派发时仍须重新校验。中心可不提供此字段。

    Resource:
      type: object
      required: [id, versions]
      properties:
        id: { type: string }
        organization_id: { type: string }
        owner_id: { type: string }
        uploader_ref: { type: object }
        display_name: { type: string }
        publication:
          type: string
          description: 取值见 enums.yaml 的 `publishing_state`。
        copied_from: { type: string, nullable: true }
        versions:
          type: array
          items: { $ref: '#/components/schemas/ResourceVersion' }

    ResourceList:
      type: object
      required: [items, has_more]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        offset: { type: integer }
        limit: { type: integer }
        has_more: { type: boolean }
        coverage: { type: object }

    DocumentInfo:
      type: object
      required: [id, resource_id, filename, status, compile_fingerprint]
      properties:
        id: { type: string }
        resource_id: { type: string, nullable: true }
        source_version_id: { type: string, nullable: true }
        source_version_no: { type: integer, nullable: true }
        filename: { type: string }
        doc_id: { type: string }
        origin: { type: string }
        mime: { type: string }
        size_bytes: { type: integer }
        page_count: { type: integer }
        status:
          type: string
          description: 取值与文案的唯一来源是 enums.yaml 的 `parse_status`。
        error: { type: string, nullable: true }
        index_status:
          type: string
          description: 取值与文案的唯一来源是 enums.yaml 的 `index_status`。
        index_error: { type: string, nullable: true }
        compile_status:
          type: string
          description: 取值与文案的唯一来源是 enums.yaml 的 `compile_status`。
        compile_degraded:
          type: array
          items: { type: string }
          description: 取值见 enums.yaml 的 `compile_degraded`。
        compile_fingerprint: { type: string }
        layout_version: { type: string }
        code_detection:
          type: string
          description: 取值见 enums.yaml 的 `code_detection`。
        current_job_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        uploaders:
          type: array
          items: { type: string }
        can_delete: { type: boolean }

    JobInfo:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        engine: { type: string }
        options: { type: object }
        status:
          type: string
          description: 取值与文案的唯一来源是 enums.yaml 的 `parse_status`。
        error: { type: string, nullable: true }
        page_count: { type: integer }
        is_current: { type: boolean }
        created_at: { type: string, format: date-time }
        archived_at: { type: string, format: date-time, nullable: true }
        document_version: { type: integer }

    DocumentStats:
      type: object
      required: [documents, pages, askable]
      properties:
        documents: { type: integer }
        pages: { type: integer }
        askable: { type: integer }

    DocumentResult:
      type: object
      required: [document_id, job_id, filename, page_count, markdown, images]
      properties:
        document_id: { type: string }
        job_id: { type: string }
        filename: { type: string }
        page_count: { type: integer }
        markdown: { type: string }
        images:
          type: array
          items: { type: string }

    Block:
      type: object
      required: [seq, page_idx, text]
      properties:
        chunk_id: { type: string, nullable: true }
        seq: { type: integer }
        page_idx: { type: integer }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          nullable: true
        page_size:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          nullable: true
        text: { type: string }

    DocumentPages:
      type: object
      required: [document_id, job_id, page_count, pages]
      properties:
        document_id: { type: string }
        job_id: { type: string }
        page_count: { type: integer }
        pages:
          type: array
          items:
            type: object
            required: [page_idx, blocks]
            properties:
              page_idx: { type: integer }
              page_size:
                type: array
                items: { type: number }
                nullable: true
              blocks:
                type: array
                items: { $ref: '#/components/schemas/Block' }

    DownloadUrl:
      type: object
      required: [url, expires_at, supports_range]
      description: |
        control-api 给浏览器的**短期**下载/预览地址（control-api `handleDownloadURL`）。
        与 corpus-api `/api/documents/{id}/source-url` 的**稳定** URL 刻意分开：
        那条的路径永远不变（模型网关的 doc_hash 幂等靠它，ADR #11/#12），这条每次都换。
      properties:
        url: { type: string }
        expires_at: { type: string, format: date-time }
        supports_range:
          type: boolean
          description: 对象存储原生支持 Range —— PDF.js 因此可以只取要看的那一页。

    SourceUrl:
      type: object
      required: [url, path, mime]
      description: |
        corpus-api 的原件**稳定** URL（`routers/documents.py::source_url`）。
        凭证住在 control schema（`file_grants`），这里问 control-api 要。
      properties:
        url: { type: string }
        path: { type: string }
        mime: { type: string }

    Citation:
      type: object
      required: [page_idx, snippet, resolved]
      description: |
        出处的对外形状只许有一处实现（`ddp_corpus/citation_out.py`）；前端类型见
        `apps/web/src/types/api.ts#Citation`。
      properties:
        evidence_id: { type: string, nullable: true }
        source_type:
          type: string
          description: 取值见 enums.yaml 的 `source_type`。
        derived_from: { type: string, nullable: true }
        chunk_id:
          type: string
          nullable: true
          description: 接不回来时是 null —— 后端宁可不给，也不会回放失效的旧值。
        parse_job_id: { type: string, nullable: true }
        seq: { type: integer, nullable: true }
        page_idx: { type: integer }
        printed_page_label: { type: string, nullable: true, description: 'PDF /PageLabels 显示标签；缺省/null 不得用物理页码编造' }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          nullable: true
        page_size:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          nullable: true
        crop_url: { type: string, nullable: true }
        snippet: { type: string }
        score: { type: number }
        similarity: { type: number, nullable: true }
        resolved: { type: boolean }

    QueryDecision:
      type: object
      properties:
        need_retrieval: { type: boolean }
        reason: { type: string }
        inherited_evidence_ids:
          type: array
          items: { type: string }
        degraded:
          type: string
          nullable: true
          description: 取值见 enums.yaml 的 `degraded`。

    CandidateDecision:
      type: object
      properties:
        evidence_id: { type: string, nullable: true }
        document_id: { type: string }
        chunk_id: { type: string, nullable: true }
        rank: { type: integer }
        score: { type: number, nullable: true }
        similarity: { type: number, nullable: true }
        accepted: { type: boolean }
        reason: { type: string }

    AssertionVerification:
      type: object
      properties:
        state: { type: string, enum: [passed, rejected, questioned, unverified] }
        mode: { type: string, enum: [auto, human], nullable: true }

    AnswerAssertion:
      type: object
      description: 回答的语义真相；无 evidence_ids 时 unsupported 必须为 true。
      properties:
        id: { type: string, nullable: true }
        position: { type: integer }
        text: { type: string }
        evidence_ids:
          type: array
          items: { type: string }
        verification: { $ref: '#/components/schemas/AssertionVerification' }
        unsupported: { type: boolean }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }

    RetrievalConfidence:
      type: object
      properties:
        level: { type: string, enum: [high, low, unknown] }
        top_similarity: { type: number, nullable: true }
        warn_below: { type: number }

    ChatMessage:
      type: object
      required: [id, role, content, verified, created_at]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }
        assertions:
          type: array
          items: { $ref: '#/components/schemas/AnswerAssertion' }
        query_decision: { $ref: '#/components/schemas/QueryDecision' }
        retrieval: { type: object }
        verified: { type: boolean }
        degraded:
          type: string
          nullable: true
          description: 取值见 enums.yaml 的 `degraded`。
        model_meta: { type: object }
        confidence: { $ref: '#/components/schemas/RetrievalConfidence' }
        created_at: { type: string, format: date-time }

    ConversationInfo:
      type: object
      required: [id, document_id]
      properties:
        id: { type: string }
        document_id: { type: string }
        title: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    SearchHit:
      type: object
      description: 印刷标签只用于展示（印刷页 iv · PDF 第 4 页）；打开原文始终使用从零起算的 page_idx。
      required: [chunk_id, page_idx, score, snippet]
      properties:
        chunk_id: { type: string }
        page_idx: { type: integer }
        printed_page_label: { type: string, nullable: true, description: 'PDF /PageLabels 显示标签；缺省/null 不得用物理页码编造' }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          nullable: true
        score: { type: number, description: RRF 融合分，只用来排序，不是相关度。 }
        similarity: { type: number, nullable: true, description: 余弦相似度，这才是"有多相关"。 }
        snippet: { type: string }

    SearchResult:
      type: object
      required: [query, groups]
      properties:
        query: { type: string }
        degraded:
          type: string
          nullable: true
          description: 非 null 表示这次检索降级了（如 embedding_unavailable），UI 必须显示出来。
        groups:
          type: array
          items:
            type: object
            required: [document_id, filename, hits]
            properties:
              document_id: { type: string }
              resource_id: { type: string, nullable: true }
              source_version_id: { type: string, nullable: true }
              source_version_no: { type: integer, nullable: true }
              parse_revision: { type: string }
              filename: { type: string }
              hits:
                type: array
                items: { $ref: '#/components/schemas/SearchHit' }

    EvidenceVerification:
      type: object
      required: [id, mode, verdict]
      properties:
        id: { type: string }
        mode: { type: string, enum: [auto, human] }
        verdict: { type: string, enum: [pass, reject, question] }
        reason_code: { type: string, nullable: true }
        reason_text: { type: string, nullable: true }
        reviewer_id: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    EvidenceDetail:
      type: object
      required: [id]
      properties:
        id: { type: string }
        resource_id: { type: string, nullable: true }
        source_version_id: { type: string, nullable: true }
        source_digest: { type: string }
        parse_revision: { type: string }
        document:
          type: object
          required: [id, filename]
          properties:
            id: { type: string }
            filename: { type: string }
        page_idx: { type: integer }
        printed_page_label: { type: string, nullable: true, description: '固定解析版本的 PDF /PageLabels 显示标签；定位仍使用 page_idx' }
        seq: { type: integer }
        parse_job_id: { type: string }
        doc_version: { type: integer }
        bbox:
          type: array
          items: { type: number }
          minItems: 4
          maxItems: 4
          nullable: true
        page_size:
          type: array
          items: { type: number }
          minItems: 2
          maxItems: 2
          nullable: true
        kind: { type: string }
        content: { type: string }
        source_type:
          type: string
          description: 取值见 enums.yaml 的 `source_type`。
        derived_from: { type: string, nullable: true }
        crop_url: { type: string, nullable: true }
        review_state: { type: string }
        chunk_id: { type: string, nullable: true }
        verifications:
          type: array
          items: { $ref: '#/components/schemas/EvidenceVerification' }

    EvidenceBacklink:
      type: object
      required: [source_kind, source_id, role, label]
      properties:
        source_kind: { type: string, enum: [assertion, extract_field, graph_edge, wiki_sentence, wiki_claim] }
        source_id: { type: string }
        role: { type: string }
        label: { type: string }
        wiki_id: { type: string }
        wiki_title: { type: string }
        revision_id: { type: string }

    BacklinkList:
      type: object
      required: [evidence_id, backlinks]
      properties:
        evidence_id: { type: string }
        backlinks:
          type: array
          items: { $ref: '#/components/schemas/EvidenceBacklink' }

    WikiRevisionDocument:
      type: object
      required: [wiki, revision]
      description: |
        版本化 Wiki 修订文档。完整形状见 `openapi/wiki-v1.yaml` 与 `ddp/wiki-format.md`；
        前端类型见 `apps/web/src/api/wiki.ts#WikiRevisionDocument`。
      properties:
        wiki:
          type: object
          required: [id, title, current_revision_id]
          properties:
            id: { type: string }
            title: { type: string }
            current_revision_id: { type: string }
            published_revision_id: { type: string, nullable: true }
        revision:
          type: object
          required: [id, wiki_id]
          properties:
            id: { type: string }
            wiki_id: { type: string }
            base_revision_id: { type: string, nullable: true }
            kind: { type: string }
            title: { type: string }
            created_by: { type: string }
            created_at: { type: string, format: date-time }
            provider: { type: object }
            limits: { type: object }
            merge_conflicts: { type: array, items: { type: object } }
            stale: { type: boolean }
            stale_reasons:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
                  description: 取值见 enums.yaml 的 `wiki_stale_reason`。
            pages: { type: array, items: { type: object } }
            dependency_manifest: { type: array, items: { type: object } }

    SSEMeta:
      type: object
      description: ask 流的首帧。`query_decision` 形状见 QueryDecision。
      required: [query_decision, retrieval]
      properties:
        query_decision: { $ref: '#/components/schemas/QueryDecision' }
        retrieval:
          type: object
          required: [chunk_ids, candidates]
          properties:
            chunk_ids:
              type: array
              items: { type: string }
            candidates:
              type: array
              items: { $ref: '#/components/schemas/CandidateDecision' }

    SSEDelta:
      type: object
      required: [text]
      properties:
        text: { type: string }

    SSECitations:
      type: object
      required: [citations]
      properties:
        citations:
          type: array
          items: { $ref: '#/components/schemas/Citation' }

    SSEAssertions:
      type: object
      required: [assertions]
      properties:
        assertions:
          type: array
          items: { $ref: '#/components/schemas/AnswerAssertion' }

    SSEDone:
      type: object
      description: 终帧。生成路径上每一轮都以 done 收尾（出错也先发 error、落库、再发 done）。
      required: [message_id, verified, confidence]
      properties:
        message_id: { type: string }
        verified: { type: boolean }
        degraded:
          type: string
          nullable: true
          description: 取值见 enums.yaml 的 `degraded`。
        confidence: { $ref: '#/components/schemas/RetrievalConfidence' }

    SSEError:
      type: object
      required: [message, code]
      properties:
        message: { type: string }
        code: { type: string }

paths:
  /api/auth/me:
    get:
      tags: [documents]
      operationId: getAuthMe
      summary: 当前用户与其在本组织内的角色
      security: [{ session: [] }]
      description: 由 control-api 自己实现（`handleMe`）。本地运行时返回单一属主。
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema:
                type: object
                required: [id, username, role]
                properties:
                  id: { type: string }
                  username: { type: string }
                  email: { type: string, nullable: true }
                  role:
                    type: string
                    description: 取值与文案的唯一来源是 enums.yaml 的 `role`。
                  organization_id: { type: string }
                  created_at: { type: string, format: date-time }

  /api/resources:
    get:
      tags: [resources]
      operationId: listResources
      summary: 资源列表
      security: [{ session: [] }]
      parameters:
        - name: scope
          in: query
          schema: { type: string, enum: [mine, site_public], default: mine }
          description: site_public 是本组织的公开目录，不是跨租户目录。
        - { name: offset, in: query, schema: { type: integer, default: 0 } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceList' }

  /api/resources/{resource_id}:
    parameters:
      - { name: resource_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [resources]
      operationId: getResource
      summary: 资源详情
      security: [{ session: [] }]
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Resource' }
    delete:
      tags: [resources]
      operationId: deleteResource
      summary: 删除资源（软删除，对象由 GC 回收）
      security: [{ session: [] }]
      responses:
        '204': { description: 已删除 }

  /api/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: 创建直传上传会话
      security: [{ session: [] }]
      description: |
        由 control-api 实现（control-v1.yaml UploadSession）。字节流不经过任何应用进程：
        客户端拿预签名分片 PUT 到对象存储，再 finalize。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size, mime]
              properties:
                filename: { type: string }
                size: { type: integer }
                mime: { type: string }
                sha256: { type: string, nullable: true }
                target_resource_id: { type: string, description: 追加版本的目标资源，创建时冻结。 }
      responses:
        '201':
          description: 会话已创建，预签名已下发
          content:
            application/json:
              schema: { type: object }

  /api/uploads/{upload_id}:
    parameters:
      - { name: upload_id, in: path, required: true, schema: { type: string } }
    get:
      tags: [uploads]
      operationId: getUpload
      summary: 查询上传会话（含 ingest_status）
      security: [{ session: [] }]
      responses:
