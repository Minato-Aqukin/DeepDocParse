  /api/search:
    get:
      tags: [search]
      operationId: search
      summary: 跨文档检索
      description: |
        与单文档问答共用授权范围内的混合检索。显式以 and + 疑问词连接的
        2–4 个英文子问题可分别检索；同时保留原问题一路，不猜测隐含子问题，
        不新增来源或扩大授权范围。至多五条查询按 EMBEDDING_BATCH_SIZE 分批向量化，
        每路候选最多为单问题配置的两倍；按原问题、各子问题的顺序轮转去重，最终 limit 不变，
        因此子问题数小于 limit 时原问题与每个子问题都先各得一个名额。
        子问题数达到或超过 limit 时改为子问题先轮转，原问题只填充剩余名额：
        limit 等于子问题数时每个子问题各得一个名额（原问题自身的命中不再保证出现）；
        limit 小于子问题数时只为顺序靠前的 limit 个子问题预留名额，不能保证其余子问题进入结果。
        score 是查询内的 RRF 分，不承诺全局按 score 排序；
        similarity 取命中子问题中的最高余弦相似度。普通问题保持原有单路编排。
        向量化失败时所有子问题均走关键词路并返回 embedding_unavailable。
      security: [{ session: [] }]
      parameters:
        - { name: q, in: query, schema: { type: string, default: '' } }
        - { name: doc, in: query, schema: { type: string, default: '' }, description: 限定单个文档。 }
        - { name: limit, in: query, schema: { type: integer, default: 20 } }
      responses:
        '200':
          description: ok
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResult' }

