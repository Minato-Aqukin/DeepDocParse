openapi: 3.1.0
info:
  title: DeepDocParse Control API
  version: 1.0.0
  description: |
    企业控制面（`services/control-api`，Go）的对外契约。**它是整个产品唯一的入口**：
    浏览器、SDK、MCP 客户端都只跟它说话。

    ## 三个前缀，三种鉴权

    | 前缀 | 谁在用 | 鉴权 |
    |---|---|---|
    | `/api/*` | 浏览器前端 | JWT 会话（Cookie 或 `Authorization: Bearer`） |
    | `/v1/*`  | 第三方 SDK | API key（`Authorization: Bearer sk-…`） |
    | `/mcp`   | MCP 客户端 | API key |

    ## 哪些端点归本服务，哪些是转发

    本文件里**显式声明**的端点由 control-api 自己实现：组织、成员、角色、
    API key、配额、计量、审计、上传会话、文件授权。

    新增持久节点握手、管理员目录与成员快照契约见 `discovery-v1.yaml`。
    `/api/v1/federation/node` 为公开持key挑战端点；`/api/v1/capabilities`、
    `/api/v1/client/handshake` 及成员快照允许会话或带 read scope 的用户 API key。
    节点管理仍只接受管理员会话；节点凭据不能替代资源 ACL。

    其余前缀是**反向代理**，契约在各自的文件里：

    - `/api/documents/*` `/api/conversations/*` `/api/search` `/api/extractions/*`
      `/api/knowledge/*` `/api/wiki/*` `/api/reviews/*` `/api/evidence/*`
      → `services/corpus-api`（Web 调用的读子集见 `content-v1.yaml`；
      注意旧的 `corpus-v1.yaml` 引用已失效，语料面没有这个文件）
    - `/v1/parse` `/v1/chat/completions` `/v1/embeddings` `/v1/extract` `/v1/rerank`
      → `services/model-gateway`（见 `gateway-v1.yaml`）
    - `/mcp` → `services/mcp`

    代理**不是透明的**：它验身份、扣配额、限速、记计量与审计，并把
    actor 上下文以内部头下发给上游（见下面的「内部头」一节）。

    ## 内部头（服务间，不对外）

    corpus-api 与 model-gateway **不自己验用户凭据**，只信任这组头：

        X-Request-Id            请求 ID
        traceparent             W3C trace context
        X-DDP-Service           调用方服务身份
        X-DDP-Organization      组织 ID（单组织部署也必须带，值为默认组织）
        X-DDP-Actor             user id 或 api key id
        X-DDP-User              已验证用户 ID；API key 时为该 key 的所有者
        X-DDP-Actor-Kind        user | api_key | service
        X-DDP-Role              该 actor 在该组织内的角色
        Idempotency-Key         写操作必带

    **这组头绝不能来自客户端。** 入口无条件剥掉客户端传来的同名头再填自己的
    —— 否则任何人都能伪造 `X-DDP-Role: admin`。有守卫钉着这件事。

    ## 错误体

    统一 OpenAI 风格（与网关一致，SDK 只需一套解析）：

        {"error": {"message": "...", "type": "...", "code": "..."}}

servers:
  - url: http://control-api:8080

tags:
  - name: auth
  - name: organization
  - name: apikeys
  - name: usage
  - name: audit
  - name: uploads
  - name: files
  - name: remote-compute
  - name: health

components:
  securitySchemes:
    session:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 浏览器会话。`/api/*` 用它。
    apiKey:
      type: http
      scheme: bearer
      description: 对外 API key（`sk-` 前缀）。`/v1/*` 与 `/mcp` 用它。

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type]
          properties:
            message: { type: string }
            type: { type: string }
            code: { type: string, nullable: true }

    Role:
      type: string
      description: |
        组织内角色。取值与语义由 `packages/contracts/enums.yaml` 的 `role` 生成，
        **不要在这里另抄一份** —— 这个 enum 列表由 CI 校验与生成物一致。
      enum: [viewer, contributor, reviewer, admin]

    ActorKind:
      type: string
      enum: [user, api_key, service]

    UploadStatus:
      type: string
      enum: [created, uploading, verifying, ready, failed, expired]

    IngestStatus:
      type: string
      enum: [pending, retrying, ready, rejected]
      description: |
        取值与文案的唯一来源是 enums.yaml 的 `ingest_status`。永久上传字节就绪之后
        的语料登记确认：只有 corpus 2xx 或 `409 duplicate_event` 才是 ready；
        ready **不是**解析/索引完成。

    IngestRejection:
      type: string
      enum: [resource_not_found, resource_version_exists, invalid_upload_target, idempotency_conflict, source_missing]
      description: 取值与文案的唯一来源是 enums.yaml 的 `ingest_rejection`；语料域对 DocumentSubmitted 的确定性拒绝码。

    User:
      type: object
      required: [id, username, role]
      properties:
        id: { type: string }
        username: { type: string }
        email: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        organization_id: { type: string }
        created_at: { type: string, format: date-time }

    Token:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: bearer }
        expires_in: { type: integer, description: 秒 }
        user: { $ref: '#/components/schemas/User' }

    Organization:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        member_count: { type: integer }

    Member:
      type: object
      required: [user_id, username, role]
      properties:
        user_id: { type: string }
        username: { type: string }
        email: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        joined_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time, nullable: true }

    ApiKey:
      type: object
      required: [id, name, key_prefix, scopes]
      properties:
        id: { type: string }
        name: { type: string }
        key_prefix: { type: string, description: 展示用前 8 位，如 sk-AbCdEfGh }
        scopes:
          type: array
          items: { type: string, enum: [parse, chat, embeddings, extract, rerank, mcp, read] }
          description: |
            key 能调哪些平面。**最小权限**：只做解析的集成不该能问答。
            空数组等于全部禁用（不是全部允许 —— 默认拒绝）。
        quota_pages: { type: integer, nullable: true, description: null = 不限 }
        used_pages: { type: integer }
        rate_limit_per_min: { type: integer }
        expires_at: { type: string, format: date-time, nullable: true }
        revoked_at: { type: string, format: date-time, nullable: true }
        last_used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CreatedApiKey:
      allOf:
        - $ref: '#/components/schemas/ApiKey'
        - type: object
          required: [key]
          properties:
            key:
              type: string
              description: |
                **明文只在创建时返回这一次**，库里只存 sha256。
                用 sha256 而非 bcrypt：每个对外请求都要验一次 key，
                bcrypt 的成本函数会直接压垮代理路径；key 本身是 32 字节随机串，
                不存在弱口令问题。

    UsagePoint:
      type: object
      properties:
        date: { type: string, format: date }
        kind:
          type: string
          enum: [parse, chat, embeddings, mcp, qa, embed, compile_vision, extract]
        pages: { type: integer }
        requests: { type: integer }

    Quota:
      type: object
      properties:
        organization_id: { type: string }
        pages_limit: { type: integer, nullable: true }
        pages_used: { type: integer }
        period_start: { type: string, format: date-time }
        period_end: { type: string, format: date-time }

    AuditEvent:
      type: object
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        actor_id: { type: string, nullable: true }
        actor_kind: { $ref: '#/components/schemas/ActorKind' }
        action: { type: string, description: 如 document.delete、apikey.revoke }
        target: { type: string, nullable: true }
        request_id: { type: string, nullable: true }
        detail: { type: object }
    UploadPurpose:
      type: string
      enum: [permanent, temporary_compute]
      description: |
        上传用途。缺省 permanent 保持现有永久上传行为；temporary_compute 仅用于获批远端原件计算的临时输入，不默认发布或永久存语料。
    RemoteComputeStatus:
      type: string
      enum: [waiting_input, content_verifying, content_verified, running, succeeded, failed, expired, cancelled, acked]
      description: |
        持久计算记录状态。waiting_input=已创建等输入上传；content_verifying/content_verified=输入摘要校验中/通过；running/succeeded=已有真实解析工作排队/完成；failed/expired/cancelled=终态失败；acked=本地已原子提交并确认，可清理临时区。
    RemoteCompute:
      type: object
      required: [id, status, input_sha256, input_size, plan_digest, source_identity, target_identity, retention]
      description: |
        succeeded 表示固定来源版本的真实 Bundle 已形成，包含原件、版面及已完成编译的冻结证据；
        等待编译时不提前固定空证据交付。编译或索引虽已结束但证据为空、索引失败时仍可交付，
        缺口以 manifest.degraded（resource_index_unavailable／evidence_unavailable）显式标出，
        编译降级原样保留在 manifest.compile_degraded。未确认的 succeeded 仍受 expires_at 约束：
        到期后状态变 expired，不再下载或确认；到期前不得因终态清理宽限期而提前丢失输出。
        取消也适用于尚未 ack 的 succeeded。晚到的解析回调不得复活取消、过期、失败或已确认的记录，
        丢回调由持久对账补齐。关闭后的临时资源先撤销，再按宽限期与引用安全 GC 回收；
        其他资源、历史证据引用、尚在执行的解析仍保护其原件与派生数据。
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/RemoteComputeStatus' }
        input_sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: '获批输入计划的完整文件 sha256（hex）；上传等待阶段不排计算，完整摘要验证后才复用已有真实解析队列' }
        input_size: { type: integer, description: '获批输入字节数；finalize 真实大小必须一致' }
        plan_digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$', description: '批准的 plan 摘要；执行时重放比对，不一致拒绝' }
        source_identity: { type: object, description: '发起方固定身份（actor/org 摘要），跨 actor 任务绑定拒绝' }
        target_identity: { type: object, description: '目标中心/执行方固定身份' }
        retention: { type: string, enum: [temporary, task_pinned], description: '临时保留策略；ack/TTL/取消/失败后清理输入与派生数据但保留其他引用' }
        expires_at: { type: string, format: date-time, description: '未确认输入与输出的可用期限；succeeded 也在到期后转 expired' }
        upload_id: { type: string, nullable: true }
        manifest: { type: object, nullable: true, description: '交付 manifest：固定源/版本/输出 hash；compile_degraded 为编译降级列表（compile_degraded 枚举），degraded 为交付缺口列表（degraded 枚举：resource_index_unavailable、evidence_unavailable）；输出经 Bundle/存储通道校验后本地原子提交再 ack' }
    UploadSession:
      type: object
      required: [id, status, object_key]
      properties:
        id: { type: string }
        status: { $ref: '#/components/schemas/UploadStatus' }
        object_key: { type: string }
        filename: { type: string }
        mime: { type: string }
        declared_size: { type: integer }
        purpose: { $ref: '#/components/schemas/UploadPurpose' }
        remote_compute_id: { type: string, nullable: true, description: 'temporary_compute 上传绑定的持久计算记录；permanent 上传为 null' }
        target_resource_id:
          type: string
          nullable: true
          description: 追加版本的目标资源；创建时冻结，事件载荷只从会话行取。null 表示独立建资源
        ingest_status:
          allOf: [{ $ref: '#/components/schemas/IngestStatus' }]
          nullable: true
          description: 字节就绪（status=ready）之前、以及 temporary_compute 上传恒为 null；之后从持久事件推导，缺事件读作 pending
        ingest_error:
          allOf: [{ $ref: '#/components/schemas/IngestRejection' }]
          nullable: true
          description: 仅 ingest_status=rejected 时非空。重试原因只留在服务端事件行，不透给上传者
        part_size: { type: integer, description: 创建时持久绑定的分片大小（字节），恢复不受配置改变影响 }
        allocation_state:
          type: string
          enum: [pending, allocating, ready, unknown]
          description: 对象存储分配状态，ready 只表示已获得 multipart 回执，与内容 ready 无关
        input_state:
          type: string
          enum: [waiting_input, content_verifying, content_verified, failed, expired]
        request_digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        declared_sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: '客户端声明的完整文件摘要（hex）；仅用于恢复时核对绑定，绝不作为服务端校验依据' }
        verified_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
        actual_size: { type: integer }
        allocation_reason: { type: string, enum: [receipt_unconfirmed_or_ambiguous] }
        recovery_action: { type: string, enum: [reconcile_same_key_or_operator_cleanup] }
        transfer_state: { type: string, enum: [unknown, complete_pending_finalize] }
        completed_parts:
          type: array
          description: S3 已确认且大小正确的分片；parts 仅重签缺失或大小错误的分片
          items:
            type: object
            required: [part_number, etag, size]
            properties:
              part_number: { type: integer }
              etag: { type: string }
              size: { type: integer }
        parts:
          type: array
          description: |
            multipart 预签名。客户端**直接 PUT 到对象存储**，不经过任何应用进程
            —— 不变式 6（大文件不得完整进入应用进程内存，也不得由应用进程中转）。
          items:
            type: object
            properties:
              part_number: { type: integer }
              url: { type: string }
        expires_at: { type: string, format: date-time }

paths:

  # ------------------------------------------------------------------ auth
  /api/auth/register:
    post:
      tags: [auth]
      summary: 注册（仅在开放注册的部署上可用）
      description: |
        单组织独占部署的引导路径。`REGISTRATION_MODE=closed` 时返回 403，
        企业部署走 OIDC。**第一个注册的用户自动成为该部署默认组织的 admin**，
        之后的注册默认 `viewer`（由 `DEFAULT_MEMBER_ROLE` 决定）。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 64 }
                password: { type: string, minLength: 8 }
                email: { type: string, nullable: true }
      responses:
        "201": { description: 已注册, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        "403": { description: 该部署未开放注册, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        "409": { description: 用户名已存在 }

  /api/auth/login:
    post:
      tags: [auth]
      summary: 登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Token' } } } }
        "401":
          description: |
            用户名或密码错误。**响应体对"用户不存在"与"密码错"必须一模一样**，
            否则它就是一个用户名枚举接口。
        "429": { description: 登录尝试过于频繁 }

  /api/auth/me:
    get:
      tags: [auth]
      summary: 当前用户与其在本组织内的角色
      security: [{ session: [] }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/User' } } } }
        "401": { description: 未登录 }

  /api/auth/oidc/login:
    get:
      tags: [auth]
      summary: 发起 OIDC 登录
      description: |
        302 到 IdP 的 authorization endpoint。企业部署的推荐路径 ——
        管理员强制 MFA 由 IdP 策略承担，本服务不实现第二因素。
      parameters:
        - { name: redirect_uri, in: query, schema: { type: string }, description: 登录成功后回到前端的哪一页 }
      responses:
        "302": { description: 跳转到 IdP }
        "501": { description: 该部署未配置 OIDC }

  /api/auth/oidc/callback:
    get:
      tags: [auth]
      summary: OIDC 回调
      parameters:
        - { name: code, in: query, required: true, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "302": { description: 带上会话跳回前端 }
        "400": { description: state 校验失败 / code 无效 }

  # ---------------------------------------------------------- organization
  /api/org:
    get:
      tags: [organization]
      summary: 当前组织
      security: [{ session: [] }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Organization' } } } }

  /api/org/members:
    get:
      tags: [organization]
      summary: 成员列表
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Member' } }
    post:
      tags: [organization]
      summary: 添加成员（admin）
      description: |
        已是本组织成员的账号按 upsert 处理：该成员的角色改为请求里的 role，而不是报错或新增第二条成员记录。
        经这条 upsert 路径把最后一个 admin 降级与经 PATCH 降级一样拒绝，返回 409（错误码 last_admin）。
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, role]
              properties:
                username: { type: string }
                role: { $ref: '#/components/schemas/Role' }
      responses:
        "201": { description: 已添加, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        "403": { description: 需要 admin }
        "409":
          description: |
            不能经已存在成员的 upsert 把最后一个 admin 降级（错误码 last_admin），成员角色不变。

  /api/org/members/{user_id}:
    patch:
      tags: [organization]
      summary: 改成员角色（admin）
      security: [{ session: [] }]
      parameters: [{ name: user_id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/Role' }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/Member' } } } }
        "403": { description: 需要 admin }
        "409":
          description: |
            不能把最后一个 admin 降级。**没有这条的话，一次误操作就能让
            组织永久失去管理能力**，而恢复要直接改库。
    delete:
      tags: [organization]
      summary: 移除成员（admin）
      security: [{ session: [] }]
      parameters: [{ name: user_id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: 已移除 }
        "403": { description: 需要 admin }
        "409": { description: 不能移除最后一个 admin }

  # -------------------------------------------------------------- apikeys
  /api/keys:
    get:
      tags: [apikeys]
      summary: 我的 API key
      security: [{ session: [] }]
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ApiKey' } }
    post:
      tags: [apikeys]
      summary: 新建 API key
      security: [{ session: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, default: default }
                scopes:
                  type: array
                  items: { type: string }
                  description: 缺省给该角色允许的全部作用域
                expires_in_days: { type: integer, nullable: true }
                quota_pages: { type: integer, nullable: true }
                rate_limit_per_min: { type: integer, nullable: true }
      responses:
        "201":
          description: 已创建（明文 key 只在这里出现一次）
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatedApiKey' }

  /api/keys/{key_id}:
    delete:
      tags: [apikeys]
      summary: 撤销
      security: [{ session: [] }]
      parameters: [{ name: key_id, in: path, required: true, schema: { type: string } }]
      responses:
        "204": { description: 已撤销 }
        "404": { description: 不存在或不属于你 }

  # ----------------------------------------------------------- usage/quota
  /api/usage:
    get:
      tags: [usage]
      summary: 用量流水
      security: [{ session: [] }]
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30, maximum: 365 } }
        - { name: scope, in: query, schema: { type: string, enum: [self, organization], default: self } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  points: { type: array, items: { $ref: '#/components/schemas/UsagePoint' } }
                  quota: { $ref: '#/components/schemas/Quota' }
        "403": { description: scope=organization 需要 admin }

  # --------------------------------------------------------------- audit
  /api/audit:
    get:
      tags: [audit]
      summary: 审计日志（admin）
      description: |
        **审计日志不可由普通管理员修改**：没有任何写接口，
        数据库层面对 `ddp_control` 只授 INSERT + SELECT（见 database/control）。
      security: [{ session: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 100, maximum: 1000 } }
        - { name: before, in: query, schema: { type: string, format: date-time } }
        - { name: action, in: query, schema: { type: string } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/AuditEvent' } }
        "403": { description: 需要 admin }

  # -------------------------------------------------------------- uploads
  /api/uploads:
    post:
      tags: [uploads]
      summary: 创建上传会话，拿 multipart 预签名
      description: |
        §9.1 的第 1–3 步。服务端在这里校验权限、配额、MIME 白名单与
        **预期大小**，然后下发对象存储的 multipart 预签名。

        客户端拿到后直接 PUT 到对象存储，**不经过任何应用进程**。
        可选 Idempotency-Key 绑定 organization + actor_kind + actor_id，建议客户端在
        发起前持久化。带 key 时必须声明完整文件 sha256；同键同正文返回已有会话，
        同键异正文返回 409。缺 key 保持兼容，每次创建独立上传，响应丢失无法按键找回。
        服务端先持久创建身份与输入配额占位，再分配 S3 multipart。
        分配回执未知时返回 202 + allocation_state=unknown，不自动重新分配。
        本接口只受理输入传输，并非任务 admission，也不表示内容已验证或任务可排队。
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [filename, size, mime]
              properties:
                filename: { type: string }
                size: { type: integer, description: 预期字节数，服务端 finalize 时会核对真实大小 }
                mime: { type: string }
                purpose: { $ref: '#/components/schemas/UploadPurpose', description: '缺省 permanent 保持现有永久上传行为；temporary_compute 必须同时绑定 remote_compute_id，且仅用于获批远端原件计算的临时输入' }
                remote_compute_id: { type: string, nullable: true, description: 'temporary_compute 上传必须绑定已创建等待输入的持久计算记录；permanent 上传不得带' }
                target_resource_id:
                  type: string
                  pattern: '^[A-Za-z0-9_-]{1,128}$'
                  description: |
                    向已有资源追加一个固定版本（仅 permanent）。进入创建摘要：同键换目标返回 409 idempotency_conflict。
                    分配存储前由语料域按上传者本人准入（存活、同组织、本人所有、未撤回；声明了 sha256 时
                    还要求目标里没有同内容版本）。同键重放直接取回原会话，不再准入。finalize 不接受此字段。
                sha256:
                  type: string
                  nullable: true
                  description: |
                    客户端算的内容哈希。**服务端不信它** —— finalize 后由后台
                    流式重算并比对，不一致则整个会话作废。传它只是为了让
                    带幂等键的重试绑定相同内容；无键上传不做跨用户或跨组织内容复用。
                    temporary_compute 上传的声明摘要还必须等于所绑计算记录的 input 摘要，否则拒绝排计算。
      responses:
        "201": { description: 已创建输入传输会话, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        "200": { description: 相同 key 与正文的已有会话，刷新缺失分片预签名, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        "202": { description: 上传身份已持久化，但分配进行中或回执未知，必须按原 key 对账, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        "409": { description: idempotency_conflict（同 key 绑定不同正文，含换目标）；resource_version_exists（目标里已有同内容版本） }
        "400": { description: invalid_upload_target（临时计算上传带目标，或目标 id 非法） }
        "404": { description: resource_not_found（目标资源不存在、已删除/撤回或不属于上传者） }
        "502": { description: upload_target_unavailable（语料域准入不可达；未分配任何存储，可原样重试） }
        "402": { description: 配额不足 }
        "413": { description: 超过单文件上限 }
        "415": { description: MIME 不在白名单 }

  /api/uploads/reconcile:
    get:
      tags: [uploads]
      summary: 按原发起主体和创建幂等键对账上传
      description: |
        key 通过 header 传递，不放在 URL 中。只查当前 organization + actor_kind + actor_id。
        不知道 upload_id 时也可找回。响应包含当前状态、有效的 completed_parts 和新签发的
        缺失 parts。重启入口不改变上传身份、part_size 或逻辑代次。
        未知 S3 分配仅按持久随机 object_key 查询；零或多个回执保持 unknown，
        不得被解释为未执行，不创建第二个 multipart。过期会话不签发 URL。
        404 只代表当前主体查不到持久记录；可能有并发 create 尚未提交，应保留原 key。
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' } }
      responses:
        "200": { description: 已知身份与当前状态；unknown 不等于失败或未执行, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        "404": { description: 当前主体没有可见记录 }
        "403": { description: 当前上传权限已撤销 }

  /api/uploads/{upload_id}:
    get:
      tags: [uploads]
      summary: 查本人上传会话状态并重签缺失分片
      description: 与 reconcile 一样枚举 S3 已完成分片，只对未过期且分配已确认的本人会话重签；响应 Cache-Control 为 no-store。
      security: [{ session: [] }]
      parameters: [{ name: upload_id, in: path, required: true, schema: { type: string } }]
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/UploadSession' } } } }
        "404": { description: 不存在 }

  /api/uploads/{upload_id}/finalize:
    post:
      tags: [uploads]
      summary: 完成上传
      description: |
        §9.1 的第 5–7 步。服务端 complete multipart、核对对象**真实大小**，
        置为 `verifying` 并异步流式校验摘要；通过后写 outbox 事件
        `DocumentSubmitted`，由 corpus-api 幂等消费。

        **必须幂等**：finalize 重试不得创建两份任务。幂等键是
        `Idempotency-Key` 头，缺省用 upload_id。键按 organization + actor_kind + actor_id
        隔离；engine/options 摘要在 S3 complete 之前持久绑定，同键不同参数明确 409。
        S3 分片枚举与字节数为权威；未上传齐返回 upload_incomplete 并保留会话可续传。
        complete 回执丢失时按同一 object_key HEAD 对账，未能确认返回 completion_unknown，
        不标记 failed，也不创建新会话。内容大小/完整 sha256 验证完成之前不发 DocumentSubmitted。
      security: [{ session: [] }]
      parameters:
        - { name: upload_id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parts:
                  type: array
                  items:
                    type: object
                    properties:
                      part_number: { type: integer }
                      etag: { type: string }
                engine: { type: string, description: 用哪个解析引擎，缺省取部署默认 }
                options: { type: object }
      responses:
        "202":
          description: 已受理，正在校验
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UploadSession' }
        "409": { description: 会话状态不允许 finalize }
        "422": { description: 对象大小与声明不符 }

  # ---------------------------------------------------------------- files
  /files/{token}:
    get:
      tags: [files]
      summary: 稳定文件 URL
      description: |
        **这个 URL 的路径必须永远稳定。** model-gateway 用它下载原件，
        而文档身份 `doc_hash` 在没有 `doc_id` 时会回退成 `sha256(file_url)` ——
        URL 一变，幂等复用与向量索引分块键全部失效（ADR #11/#12，踩过两次）。

        实现是 **302 到对象存储的短期签名 URL**，而不是由本进程转发字节流
        （不变式 6）。短期签名只出现在 `Location` 里，不改变本路径。

        token 本身即凭证（32 字节随机），可撤销、可设过期。v3 凭证绑定
        subject_id/resource_id，每次兑换重查主体成员资格与资源ACL；地址不会
        因普通重试变化。旧无主体凭证拒绝兑换，须重新授权；证据身份保持不变。
      parameters:
        - { name: token, in: path, required: true, schema: { type: string } }
      responses:
        "302":
          description: 跳转到短期签名 URL
          headers:
            Location: { schema: { type: string } }
            Cache-Control: { schema: { type: string }, description: no-store（签名 URL 不许被缓存） }
        "404": { description: token 不存在 / 已撤销 / 已过期 }

  /api/documents/{document_id}/download-url:
    get:
      tags: [files]
      summary: 取浏览器用的短期下载/预览 URL
      description: |
        与 `/files/{token}` **分开**：这条每次返回一个新的短期 URL，
        给浏览器 PDF.js 用（支持 HTTP Range，看一页不用下整份）。
        绝不能拿它去喂 model-gateway —— 那会破坏 doc_hash 幂等。
        每次签发前向语料域检查当前主体的资源权限。组织内有文件凭证不代表可读。
        无权与不存在统一 404；权限服务不可用返回 502，不签发 URL。
      security: [{ session: [] }]
      parameters:
        - { name: document_id, in: path, required: true, schema: { type: string } }
        - { name: resource_id, in: query, schema: { type: string }, description: 旧文档映射多条可读资产时必填 }
        - { name: disposition, in: query, schema: { type: string, enum: [inline, attachment], default: inline } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                type: object
                properties:
                  url: { type: string }
                  expires_at: { type: string, format: date-time }
                  supports_range: { type: boolean }
        "403": { description: 无权访问 }
  # ----------------------------------------------- remote-compute（远端原件计算）
  /api/v1/remote-compute:
    post:
      tags: [remote-compute]
      summary: 幂等创建等待输入的持久计算记录
      description: |
        本任务外部能力采用 `corpus.parse` 的获批输入计划；不经过仅支持 retrieve/answer 的现有联邦根任务入口。
        调用方先以 Idempotency-Key 创建 waiting_input 记录（固定 input 摘要/plan 摘要/source 身份/target 身份/retention），再用复用的 `/api/uploads` multipart+reconcile+finalize 数据通道上传 `temporary_compute` 输入。
        上传等待阶段不排计算；完整摘要验证后复用已有真实解析队列（borndigital 真实解析），不把元数据预检冒充 content_verified，不把临时资料加入永久公开检索。
        同一 actor/org 才能绑定输入；input 摘要/plan 摘要/source 身份固定，不得默认发布或永久存语料。
      security: [{ session: [] }]
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input_sha256, input_size, plan_digest, source_identity, target_identity]
              properties:
                input_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
                input_size: { type: integer }
                plan_digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
                source_identity: { type: object }
                target_identity: { type: object }
                retention: { type: string, enum: [temporary, task_pinned], default: temporary }
      responses:
        "201": { description: 已创建等待输入的计算记录, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteCompute' } } } }
        "200": { description: 同键同正文的已有记录, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteCompute' } } } }
        "409": { description: idempotency_conflict，同键绑定不同输入/计划/身份 }
  /api/v1/remote-compute/{id}:
    get:
      tags: [remote-compute]
      summary: 计算状态与固定输入输出 manifest
      description: |
        返回持久记录状态与固定输入输出 manifest（源/版本/输出 hash）。TTL/取消/失败/确认状态可见；输出通过既有 Bundle/存储通道，校验后本地原子提交再 ack。
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { description: ok, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteCompute' } } } }
        "404": { description: 不存在或非同一 actor/org }
  /api/v1/remote-compute/{id}/bundle:
    get:
      tags: [remote-compute]
      summary: 固定输出 ZIP 的有界下载与断点续传
      description: |
        先验证同一 actor/org，再按固定输出 manifest 提供 ZIP；读取不是确认。
        单段 Range 使用 bytes=start-end（含两端，末端按文件长度截断），
        If-Match 使用带双引号的 output_sha256；完整 ZIP 上限 64 MiB。
        分段头声明固定 manifest 摘要，不代表分段已证明完整输出摘要：
        本机必须校验拼接后全部字节，原子导入并持久化后才能 ACK。
        完整协议见 remote-compute-v1.yaml 的同一路径；控制面流式透传范围与条件头。
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Range, in: header, schema: { type: string }, description: 单段字节范围 }
        - { name: If-Match, in: header, schema: { type: string }, description: 带双引号的固定 output_sha256 }
      responses:
        "200": { description: 完整且通过固定摘要检查的 ZIP }
        "206":
          description: 指定范围，完整摘要须由本机验证
          headers:
            Content-Range: { schema: { type: string } }
            Content-Length: { schema: { type: integer } }
            Accept-Ranges: { schema: { type: string, const: bytes } }
            ETag: { schema: { type: string } }
            X-Output-SHA256: { schema: { type: string } }
          content:
            application/zip:
              schema: { type: string, format: binary }
        "404": { description: 不存在、非同一主体或输出不可用 }
        "412": { description: 固定输出摘要前提不满足 }
        "416": { description: 范围无效、越界或请求多个范围 }
        "502": { description: 输出存储不可读、超限或与声明不符 }
  /api/v1/remote-compute/{id}/cancel:
    post:
      tags: [remote-compute]
      summary: 幂等取消持久计算
      description: |
        显式幂等取消，包括尚未确认的 succeeded；取消后撤销该计算的临时资源，
        按宽限期清理输入与派生数据但保留其他引用（引用安全 GC）。已 ack 的记录不可再取消。
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' } }
      responses:
        "200": { description: 取消后的记录, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteCompute' } } } }
        "404": { description: 不存在或非同一 actor/org }
        "409": { description: 已终态确认，不可取消 }
  /api/v1/remote-compute/{id}/ack:
    post:
      tags: [remote-compute]
      summary: 本地原子提交后的确认
      description: |
        本地断点下载验证、原子导入后，以固定输出 hash 确认；重复/丢失回执可重放（同键同摘要返回已有确认，同键异摘要 409）。ack 后清理输入与派生数据但保留其他引用。
      security: [{ session: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: Idempotency-Key, in: header, required: false, schema: { type: string, minLength: 1, maxLength: 200, pattern: '^[!-~]+$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [output_sha256]
              properties:
                output_sha256: { type: string, pattern: '^[a-f0-9]{64}$', description: '本地校验通过的固定输出 hash，必须等于交付 manifest' }
      responses:
        "200": { description: 已确认, content: { application/json: { schema: { $ref: '#/components/schemas/RemoteCompute' } } } }
        "404": { description: 不存在或非同一 actor/org }
        "409": { description: 输出 hash 不符或状态不可确认 }

  # --------------------------------------------------------------- health
  /healthz:
    get:
      tags: [health]
      summary: 存活探针（不查依赖 —— 依赖挂了不该被重启）
      responses:
        "200": { description: ok }

  /readyz:
    get:
      tags: [health]
      summary: 就绪探针（查 PG / Redis / 对象存储 / 上游服务）
      responses:
        "200": { description: ready }
        "503": { description: 依赖未就绪 }
