openapi: 3.1.0
info:
  title: DeepDocParse Resource Bundle API
  version: 1.0.0
  description: DDP-Bundle v1。入口身份与资源ACL均必需；详见../ddp/bundle-format.md。
paths:
  /api/bundles/import:
    post:
      operationId: importBundle
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/zip:
            schema: {type: string, format: binary}
      responses:
        '201': {description: 校验通过且所有对象已持久化，私有资源ready，索引必须重建}
        '200': {description: 相同操作重试，返回已有本地资源身份}
        '404': {description: 资源不存在或不可访问}
        '409': {description: 幂等冲突或原文明确缺失，未发布资源}
        '413': {description: 超过压缩包或解压限制}
        '422': {description: 路径或schema或摘要或证据不合法，未发布资源}
  /api/resources/{resource_id}/versions/{version_id}/bundle:
    parameters:
      - {in: path, name: resource_id, required: true, schema: {type: string}}
      - {in: path, name: version_id, required: true, schema: {type: string}}
    get:
      operationId: exportBundle
      parameters:
        - in: query
          name: licence_valid_until
          description: 来源导出方指定带时区 RFC3339 原件许可期限；导入快照不能覆盖期限。
          schema: {type: string, format: date-time}
      responses:
        '200':
          description: 固定资源版本快照
          content:
            application/zip:
              schema: {type: string, format: binary}
        '400': {description: 无时区或无效期限，或持有方尝试覆盖来源期限}
        '409': {description: bundle_licensed_derivative：导入快照的本地重解析版本不能另作来源导出，请导出导入的快照版本}
        '410': {description: 授权副本已撤销或过期，source_unavailable}
        '404': {description: 资源不存在或无权访问}
        '503': {description: 本节点持久身份未配置}
  /api/resources/{resource_id}/versions/{version_id}/bundle/licensed-source:
    parameters:
      - {in: path, name: resource_id, required: true, schema: {type: string}}
      - {in: path, name: version_id, required: true, schema: {type: string}}
    get:
      operationId: getLicensedSource
      responses:
        '302':
          description: "302 到短期直读 URL（Location，字节不经过应用进程）；响应头 X-DDP-Source-Digest、X-DDP-Source-Availability（offline_snapshot），有期限时另带 X-DDP-Source-Licence-Valid-Until；URL 寿命截到许可期限为止"
          headers:
            Location: {schema: {type: string}}
            X-DDP-Source-Digest: {schema: {type: string}}
            X-DDP-Source-Availability: {schema: {type: string}}
            X-DDP-Source-Licence-Valid-Until: {schema: {type: string, format: date-time}}
            Cache-Control: {schema: {type: string}}
        '410': {description: 授权副本已撤销或过期，source_unavailable}
        '404': {description: 资源不存在或无权访问}
  /api/resources/{resource_id}/versions/{version_id}/bundle/evidence:
    parameters:
      - {in: path, name: resource_id, required: true, schema: {type: string}}
      - {in: path, name: version_id, required: true, schema: {type: string}}
    get:
      operationId: getBundleEvidence
      responses:
        '200': {description: 冻结原始证据与来源身份，不自动认定语义复核通过}
        '404': {description: 资源不存在或无权访问}
