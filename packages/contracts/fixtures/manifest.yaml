- {fixture: valid/resource-owned.json,                   schema: ddp-resource/v1.json, def: Resource,        expect: valid}
- {fixture: valid/resource-copied.json,                  schema: ddp-resource/v1.json, def: Resource,        expect: valid}
- {fixture: valid/resource-version-v1.json,              schema: ddp-resource/v1.json, def: ResourceVersion, expect: valid}
- {fixture: valid/resource-version-shared-content.json,  schema: ddp-resource/v1.json, def: ResourceVersion, expect: valid}
