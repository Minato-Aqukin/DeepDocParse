- fixture: invalid/resource-unknown-publication.json
  schema: ddp-resource/v1.json
  def: Resource
  expect: invalid
  violates: $.publication
  violates_keyword: enum
  because: publication 只能取 publishing_state 的四个值。"public" 不在表里 —— 发布范围是有授权含义的，多一个词就是多一种没人检查的状态。

- fixture: invalid/resource-version-zero.json
  schema: ddp-resource/v1.json
  def: ResourceVersion
  expect: invalid
  violates: $.version_no
  violates_keyword: minimum
  because: 版本号 1 基。允许 0 会让"第一版"有两种写法，而固定版本引用靠它对齐。

- fixture: invalid/upload-event-bad-digest.json
  schema: ddp-resource/v1.json
  def: UploadEvent
  expect: invalid
  violates: $.request_digest
  violates_keyword: pattern
  because: §4.1 —— 服务端校验输入摘要，不能直接信任客户端声明。收一个形状都不对的字符串等于没校验。

