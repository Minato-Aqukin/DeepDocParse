        label: 没有观测到物理 GPU 上的模型层卸载，已停止该进程。需要 CPU 时请明确选择 CPU 运行包。
        severity: error
      - value: model_backend_incompatible
        summary: 所选模型与运行包不兼容
        label: 所选模型与运行包不兼容。
        severity: error
      - value: model_process_busy
        summary: 受管模型正在运行，先停止再切换模型或后端
        label: 请先停止当前受管模型，再切换模型或后端。
        severity: warn
      - value: egress_denied
        summary: 中心拒绝了这次外发许可
        label: 中心拒绝了这次外发许可。
        severity: error
      - value: invalid_response
        summary: 中心返回的内容无法识别
        label: 中心返回的内容无法识别。
        severity: error
      - value: invalid_arguments
        summary: 请求参数不合法，宿主拒绝执行
        label: 请求参数不正确，宿主拒绝执行。
        severity: error
      - value: host_operation_failed
        summary: 宿主操作失败且结果未知，须按幂等键对账
        label: 宿主操作结果未知，请查询回执后再处理。
        severity: warn

  local_dispatch_state:
    description: |
      本机运行时联邦派发状态机（`ddp_local/federation_dispatch.py` 的 `state`）。
      与契约轴分开：它是"本机镜像看到的进展"，中心的权威状态以对账结果为准。
      展示时按契约轴摆（规划/受理/交付），明细收进详情 —— 不许压成一个绿色完成。
    applies_to: [client, desktop]
    values:
      - {value: prepared,          summary: 计划已建，还没派发,                       label: 尚未派发,                     severity: neutral}
      - {value: exploring,         summary: 已派发探索，中心规划中,                   label: 中心规划中,                   severity: progress, active: true}
      - {value: planned,           summary: 中心计划已就绪，待审阅批准,               label: 中心计划已就绪,               severity: progress, active: true}
      - {value: explore_unknown,   summary: 探索发出但回执丢失，需对账,               label: 探索结果未知 · 需对账,         severity: warn, active: true}
      - {value: submitted,         summary: 已提交中心执行,                           label: 中心执行中,                   severity: progress, active: true}
      - {value: submit_unknown,    summary: 提交发出但回执丢失，需对账,               label: 提交结果未知 · 需对账,         severity: warn, active: true}
      - {value: approved,          summary: 中心已批准（中心侧状态）,                 label: 中心已批准,                   severity: progress, active: true}
      - {value: succeeded,         summary: 中心已完成,                               label: 中心已完成,                   severity: ok}
      - {value: failed,            summary: 失败，失败原因持久化在镜像里,             label: 失败,                         severity: error}
      - {value: cancelled,         summary: 已取消（显式终态）,                       label: 已取消,                       severity: neutral}
      - {value: delivered,         summary: 已交付并经本地确认,                       label: 已交付,                       severity: ok}
      - {value: waiting_input,     summary: 文件计划：等原始输入上传完，不占算力,     label: 等待原始输入,                 severity: progress, active: true}
      - {value: uploading,         summary: 文件计划：原始输入上传中,                 label: 上传中,                       severity: progress, active: true}
      - {value: content_verifying, summary: 文件计划：服务端全量校验中,               label: 完整摘要校验中,               severity: progress, active: true}
      - {value: content_verified,  summary: 文件计划：输入已校验，待执行,             label: 输入已校验 · 等待执行,         severity: progress, active: true}
      - {value: running,           summary: 中心计算执行中,                           label: 中心计算中,                   severity: progress, active: true}
      - {value: expired,           summary: 临时产物已过期,                           label: 临时产物已过期,               severity: warn}
      - {value: acked,             summary: 本机已确认交付,                           label: 本机已确认交付,               severity: ok}
      - {value: cancel_unknown,    summary: 取消发出但回执丢失，需对账,               label: 取消结果未知 · 需对账,         severity: warn}
      - {value: resume_unknown,    summary: 继续请求发出但回执丢失，需对账,           label: 继续请求结果未知 · 需对账,     severity: warn, active: true}

  local_verify_state:
    description: |
      宿主对取回的交付字节重算摘要的结果（`bridge.d.ts` 的 `PlanDetail.verification`）。
      与契约 `validation_state` 分开：那条是中心对输出引用的结构校验，
      这里是本机对交付字节的摘要重算 —— 只有 `passed` 才允许确认交付。
    applies_to: [client, desktop]
    values:
      - {value: passed,      summary: 本地重算摘要与中心声明一致，可以确认, label: 本地重算摘要一致,     severity: ok}
      - {value: failed,      summary: 本地重算摘要与中心声明不一致，禁止确认, label: 本地重算摘要不一致, severity: error}
      - {value: unavailable, summary: 尚无取回的交付可校验,                   label: 尚无可校验的本地结果, severity: neutral}

  local_transfer_state:
    description: |
      文件计划的对象存储传输相位（`bridge.d.ts` 的 `PlanDetail.transfer`）。
      上传走的是宿主独占的传输循环，账本只记录相位与字节 ——
      上传完成不等于解析完成，界面不许把两者混成一个"成功"。
    applies_to: [client, desktop]
    values:
      - {value: prepared,  summary: 传输尚未开始,                         label: 待发送,                       severity: neutral}
      - {value: creating,  summary: 正在准备临时上传,                     label: 准备临时上传,                 severity: progress, active: true}
      - {value: uploading, summary: 正在上传缺片,                         label: 正在上传缺片,                 severity: progress, active: true}
      - {value: verifying, summary: 已上传，等待确认服务端全量校验结果,   label: 已上传，等待确认服务端全量校验结果, severity: progress, active: true}
      - {value: verified,  summary: 输入已通过服务端校验,                 label: 输入已通过服务端校验,         severity: ok}
      - {value: unknown,   summary: 上次传输中断，需先对账再继续,         label: 上次传输中断，需对账,         severity: warn}

  bundle_replica_availability:
    description: 固定版本授权副本的可读状态，不代表来源节点在线。
    applies_to: [bundle]
    values:
      - value: licensed_copy
        summary: 未撤销且未过期的许可离线快照
        label: 离线快照（不是源节点在线，也不是重新授权）
        severity: warn
      - value: unavailable
        summary: 授权副本已撤销或过期，禁止读取原件
        label: 来源已撤销或过期（410），停止新授权，不显示在线。
        severity: error
