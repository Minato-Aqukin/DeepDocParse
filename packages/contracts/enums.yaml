# DeepDocParse 契约枚举 —— **语言中立的唯一真相。**
#
# Go / TypeScript / Python 三侧的枚举常量、类型与**用户可见文案**全部由
# `scripts/generate.py` 从这里生成。合仓前它们各写一份：
#   Python  ddp_corpus/models.py 的注释 + qa.py/extraction.py 里的字符串字面量
#   TS      apps/web/src/constants/{status,compilation}.ts
#   契约    openapi.yaml 的 enum 列表
# 三处漂开的表现是**加了一种降级但界面显示原始英文枚举**，或者更糟：
# 后端打了降级、前端的表里没有这一项，于是那条降级在 UI 上等于不存在 ——
# 而"降级必须可见"是这个项目的第二条不变式。
#
# ## 每个取值必须写全四样
#
#   value        枚举值本身（snake_case，跨语言一致）
#   summary      给开发者的一句话：什么情况下会打这个值
#   label        给用户的一句话（中文）。**不是把枚举名翻译一遍** ——
#                要说清"发生了什么、对你意味着什么"
#   severity     neutral | progress | ok | warn | error
#                语义色，**不是 UI 框架的颜色名**。前端在一处把它映射成
#                Element Plus 的 tag type（neutral->info、progress->warning、
#                ok->success、warn->warning、error->danger），
#                换 UI 框架只改那一处，不必回来动契约。
#
# 缺任何一样，生成器直接报错退出（`scripts/generate.py` 里有断言）。
# 这是刻意的：一个没有 label 的降级值等于一个用户看不懂的降级值。

version: 1

enums:

  # ------------------------------------------------------------------
  degraded:
    description: |
      问答 / 检索 / 抽取平面的降级原因。落在 `messages.degraded`、
      DDP-Extract 的 `degraded`、以及检索响应里。

      **一次只报一个**（最先命中的那个）。需要同时报多个的场合请用
      `compile_degraded` 那种列表形状，不要往这里塞逗号分隔串。
    applies_to: [qa, search, extract]
    values:
      - value: no_hits
        summary: 检索一条都没命中
        label: 未在本文档中检索到相关内容
        severity: neutral
      - value: parse_mismatch
        summary: |
          裁图上的文字与解析出的块文本对不上（相似度低于
          QA_PARSE_MISMATCH_THRESHOLD / EXTRACT_MISMATCH_THRESHOLD，实测标定 0.55）。
          它是**假出处**的主要探测手段，不是小问题。
        label: 出处存疑（图上内容与解析文本对不上）
        severity: warn
      - value: resource_index_unavailable
        summary: 授权资源的固定解析版本尚无可用索引
        label: 该资源版本索引尚不可用，请查看解析任务
        severity: warn
      - value: embedding_unavailable
        summary: |
          向量化服务不可达，只走了关键词路。**这条是本项目吃过最大亏的地方**：
          M4a 时向量检索静默退回 BM25，没人发现。必须可见。
        label: 仅关键词检索（向量化服务不可用）
        severity: warn
      - value: vision_unavailable
        summary: 视觉模型不可用，本轮没做视觉核对
        label: 未做视觉验证（视觉模型不可用）
        severity: warn
      - value: crop_unsupported
        summary: 该文件类型不支持按 bbox 裁图（例如非 PDF 原件）
        label: 未做视觉验证（该文件不支持区域截图）
        severity: neutral
      - value: crop_failed
        summary: 裁图渲染失败。**注意**：依赖缺失不走这条，见 ddp_core/crops.py 的 _DEP_NOTE
        label: 未做视觉验证（区域截图失败）
        severity: warn
      - value: client_aborted
        summary: 客户端在流式回答途中断开
        label: 回答被中断
        severity: neutral
      - value: upstream_error
        summary: 上游模型服务返回错误
        label: 问答服务异常
        severity: error
      - value: upstream_interrupted
        summary: 上游在流式输出中途断流（拿到的是半截答案）
        label: 回答生成中途断流
        severity: error
      - value: index_changed_during_answer
        summary: 回答生成期间索引 generation 变了，本轮出处已标失效
        label: 回答生成期间索引版本已变化，出处已标为失效
        severity: warn
      - value: decision_unavailable
        summary: "「这轮要不要检索」的判定模型不可用，已保守地执行检索"
        label: 是否检索判定不可用，已保守执行检索
        severity: neutral
      - value: no_evidence_in_turn
        summary: 本轮既没检索到证据也没有可继承证据，拒绝脱离文档作答
        label: 本轮没有可继承证据，已拒绝脱离文档作答
        severity: warn
      - value: inherited_evidence_incomplete
        summary: 上一轮的证据部分失效，不能直接沿用
        label: 上一轮证据已部分失效，需重新检索后再回答
        severity: warn
      - value: gate_rejected_all
        summary: 候选全部没通过逐篇质量门控（有候选但都不够格，与 no_hits 不同）
        label: 检索候选均未通过逐篇质量门控
        severity: warn
      - value: citation_persist_failed
        summary: 出处写库失败，相关结论已标为无证据支持
        label: 出处保存失败，相关结论已标为无证据支持
        severity: error
      - value: verification_unavailable
        summary: 原文自动核对没得出结论
        label: 原文自动核对未得出结论，请人工复核
        severity: warn
      - value: evidence_unavailable
        summary: |
          远端计算的固定版本编译完成但没有可交付的冻结证据；交付 Bundle 只含原件与版面。
          与 no_hits 不同：这里不是检索没命中，而是证据本身不存在。
        label: 交付结果不含冻结证据（原件与版面仍可用）
        severity: warn
      - value: schema_violation
        summary: |
          模型输出不符合约定结构。抽取平面：按 EXTRACT_MAX_RETRIES 重试仍失败；
          问答平面：回答未满足逐条证据绑定协议（非法 JSON、缺失/越界 evidence_id、
          截断），不重试，已校验的完整断言作为显式失败的部分回答保留。
          **绝不能被静默当成 not_found / 文档中没有** —— 那会把系统故障伪装成"文档里没有"。
        label: 模型输出不符合约定格式
        severity: error
      - value: rerank_unavailable
        summary: 配了精排但上游没注册 rerank 模型，本轮没重排
        label: 未做精排（重排序服务不可用）
        severity: neutral
      - value: no_instruct_model
        summary: |
          注册表里只有 OCR 专用模型（`capabilities` 含 `no_instruct`），
          抽值无处可调。同样绝不能伪装成 not_found。
        label: 未抽取（后端没有可用的指令模型）
        severity: error
      # 下面两个是 MCP 平面独有的（`ddp_mcp/corpus.py`）。合仓时由
      # scripts/check_enum_usage.py 扫出来 —— 它们此前从没进过任何枚举清单，
      # 于是 MCP 返回它们时，任何按枚举分支渲染的消费方都当作"没有降级"。
      - value: empty_query
        summary: MCP `search` 收到空查询串，直接返回空结果
        label: 查询词为空
        severity: neutral
      - value: answer_unavailable
        summary: MCP `ask` 调上游生成时非 200，本轮没有答案（证据仍然返回）
        label: 生成服务不可用（证据已返回，结论未生成）
        severity: error

  # ------------------------------------------------------------------
  compile_degraded:
    description: |
      版面编译（DDP-Compile v1）的降级。与 `degraded` 分开是因为它是
      **列表**：一次编译可以同时有好几种降级，而且它落在
      `documents.compile_degraded`（JSON 数组）上。
    applies_to: [compile]
    values:
      - value: code_detection_unavailable
        summary: 当前版面引擎报不出代码块
        label: 当前版面引擎不能识别代码块
        severity: neutral
      - value: crop_unsupported
        summary: 部分视觉原子没有可定位的裁图
        label: 部分视觉原子没有可定位裁图
        severity: neutral
      - value: crop_failed
        summary: 部分视觉原子裁图失败
        label: 部分视觉原子裁图失败
        severity: warn
      - value: vision_unavailable
        summary: 视觉理解模型不可用
        label: 视觉理解模型不可用
        severity: warn
      - value: vision_invalid_output
        summary: 视觉模型返回的结构不合规
        label: 视觉理解模型返回的结构不合规
        severity: warn
      - value: provider_unresolved
        summary: 上游实际模型没解析出来，本次编译版本不可比较
        label: 上游实际模型未解析，当前编译版本不可比较
        severity: warn
      - value: reindex_validation_required
        summary: 存在历史出处，需先校验并人工确认后才能重建
        label: 存在历史出处，需先校验并确认后重建
        severity: warn
      - value: compile_failed
        summary: 版面编译整体失败
        label: 版面编译失败
        severity: error
      - value: layout_unavailable
        summary: 导入的来源没有可用版面（layout.json 缺失或无效），未编译、未建索引
        label: 来源版面不可用，未编译
        severity: error

  # ------------------------------------------------------------------
  parse_status:
    description: |
      解析任务状态。契约（`/v1/parse/{id}`）只承诺四态；
      `archiving` 是**产品层**多出来的一态：网关已完成但归档还没落地，
      对用户是"还在动"。
    applies_to: [parse]
    values:
      - {value: pending,   summary: 已受理，排队中,               label: 排队中,   severity: neutral,  active: true}
      - {value: running,   summary: 引擎正在解析,                 label: 解析中,   severity: progress,  active: true}
      - {value: archiving, summary: 引擎已完成，产品层正在归档结果, label: 归档中,   severity: progress,  active: true}
      - {value: succeeded, summary: 解析完成且结果已可取,          label: 已完成,   severity: ok}
      - {value: failed,    summary: 解析失败，error 里有原因,       label: 失败,     severity: error}
    contract_subset:
      # 契约只承诺这四个，`archiving` 不出现在 /v1/* 响应里
      openapi_v1: [pending, running, succeeded, failed]

  index_status:
    description: 向量索引状态。索引失败必须能在 UI 上看到，不许静默。
    applies_to: [document]
    values:
      - {value: none,     summary: 还没建过索引,           label: 未索引,   severity: neutral}
      - {value: pending,  summary: 已排队等待索引,         label: 待索引,   severity: neutral, active: true}
      - {value: indexing, summary: 正在建索引,             label: 索引中,   severity: progress, active: true}
      - {value: ready,    summary: 索引可用，可以问答,     label: 可问答,   severity: ok}
      - {value: failed,   summary: 索引失败，index_error 里有原因, label: 索引失败, severity: error}

  compile_status:
    description: |
      版面编译状态。**索引 ready 不代表视觉理解完整** —— 编译状态与降级
      必须单列并在前端展示。
    applies_to: [document]
    values:
      - {value: none,      summary: 还没编译,               label: 未编译,     severity: neutral}
      - {value: pending,   summary: 已排队等待编译,         label: 待编译,     severity: neutral, active: true}
      - {value: compiling, summary: 正在编译,               label: 编译中,     severity: progress, active: true}
      - {value: ready,     summary: 编译完整、无降级,       label: 编译完整,   severity: ok}
      - {value: partial,   summary: 编译完成但有降级，见 compile_degraded, label: 编译有降级, severity: warn}
      - {value: failed,    summary: 编译失败,               label: 编译失败,   severity: error}

  run_status:
    description: |
      抽取批次状态。`partial` **不是"有点问题"的委婉说法**：它明确表示
      必填字段没抽全，或批次里个别文档失败。一批 200 份里有 3 份失败
      报成"成功"，会让人直接拿去用。
    applies_to: [extract]
    values:
      - {value: pending,   summary: 已受理，排队中,         label: 排队中,     severity: neutral, active: true}
      - {value: running,   summary: 正在抽取,               label: 抽取中,     severity: progress, active: true}
      - {value: succeeded, summary: 全部文档全部字段都完成, label: 已完成,     severity: ok}
      - {value: partial,   summary: 部分文档或部分字段失败, label: 部分完成,   severity: warn}
      - {value: failed,    summary: 整批失败,               label: 失败,       severity: error}

  field_status:
    description: |
      DDP-Extract 的字段三态。**必须分开对待**：`not_found` 是"我们看过了，
      文档里确实没有"，是一种正确答案；`error` 才是系统问题。
      界面上 not_found 绝不能显示成空白或 "—"（那让人以为是没渲染出来），
      error 也绝不能显示成"未提及"（那是把系统故障伪装成事实）。
    applies_to: [extract]
    values:
      - {value: found,     summary: 抽到了值，且有出处,     label: 已抽取,         severity: ok}
      - {value: not_found, summary: 文档里确实没有这个字段, label: 文档中未提及,   severity: neutral}
      - {value: error,     summary: 抽取过程本身出错,       label: 抽取失败,       severity: error}

  code_detection:
    description: 代码块识别的来源。启发式与原生要分开，因为它决定了代码检索的可信度。
    applies_to: [compile]
    values:
      - {value: native,      summary: 版面引擎直接报出了 code 块, label: "代码识别：原生",   severity: ok}
      - {value: heuristic,   summary: 靠启发式规则判出来的,       label: "代码识别：启发式", severity: neutral}
      - {value: unavailable, summary: 当前引擎识别不了代码块,     label: "代码识别：不可用", severity: warn}

  source_type:
    description: |
      证据是原文还是生成物。**第三条不变式**：生成物与原文必须可区分，
      且生成物的引用最终仍要指回原始原子 bbox（`derived_from`）。
      判据是 `evidence.derived_from` 是否为空 —— 不要在别处另立标志位。
    applies_to: [evidence, citation]
    values:
      - {value: source,    summary: 直接来自版面的原子（derived_from 为空）, label: 原文,     severity: neutral}
      - {value: generated, summary: 模型生成的理解（derived_from 指向原子）, label: 生成理解, severity: warn}

  block_type:
    description: |
      DDP-Layout v1.1 的块类型词汇表 —— **契约的一部分**。
      每个引擎的 normalizer 都必须产出这八个值之一；认不出来的归 `other`
      （不是丢弃 —— 丢弃会让新引擎的块凭空消失）。
      规范实现在 `ddp_core.blocks.normalize_type`，守卫在
      `scripts/check_blocktype_parity.py`。
    applies_to: [layout]
    values:
      - {value: text,     summary: 正文段落。也是"压根没有 type"时的默认, label: 正文,   severity: neutral}
      - {value: title,    summary: 各级标题,                            label: 标题,   severity: neutral}
      - {value: code,     summary: 代码块,                              label: 代码,   severity: neutral}
      - {value: table,    summary: 表格（table_html 可能有值）,          label: 表格,   severity: neutral}
      - {value: figure,   summary: 图。**无 caption 也要产出原子**，否则视觉链路没输入, label: 图, severity: neutral}
      - {value: equation, summary: 行间公式,                            label: 公式,   severity: neutral}
      - {value: list,     summary: 列表,                                label: 列表,   severity: neutral}
      - value: other
        summary: 有 type 但不在映射表里 —— 与「压根没有 type」要分开，后者归 text
        label: 其它
        severity: neutral

  usage_kind:
    description: |
      计量流水的种类。`extract` 按**字段数**计 requests：一次抽取 = N 次检索
      + N 次模型调用，按"一次请求"计费会让 60 字段的 schema 和 1 字段的一样便宜。
    applies_to: [metering]
    values:
      - {value: parse,          summary: 文档解析，按页计,       label: 解析,       severity: neutral}
      - {value: chat,           summary: 对外 chat 代理，按次计, label: 对话,       severity: neutral}
      - {value: embeddings,     summary: 对外向量化代理,         label: 向量化,     severity: neutral}
      - {value: mcp,            summary: MCP 工具调用,           label: MCP 调用,   severity: neutral}
      - {value: qa,             summary: 站内问答,               label: 问答,       severity: neutral}
      - {value: embed,          summary: 索引时的向量化,         label: 索引向量化, severity: neutral}
      - {value: compile_vision, summary: 编译期的视觉理解调用,   label: 视觉理解,   severity: neutral}
      - {value: extract,        summary: 结构化抽取，按字段数计, label: 结构化抽取, severity: neutral}
      # 合仓时由 scripts/check_enum_usage.py 扫出来：`routers/knowledge.py`
      # 一直在记这个种类，而它从没出现在任何枚举清单里（旧的 UsageRecord.kind
      # 注释也没列）。于是 control 侧的账目会出现一个没人认识的分类，
      # 对账时表现为"总数对不上"
      - {value: knowledge,      summary: 图谱 / wiki 生成，按次计, label: 知识生成, severity: neutral}
      # 联邦计量（2026-10-03，T81／T58）：只记账、不扣配额（requests=1，pages=0）。
      # 两个种类是两笔不同的账：执行者记它替别人跑了一次执行，协调者记它的任务
      # 产出了一份可交付结果；都按业务键恰好一次，重放、补做、代次推进、对账都不再记。
      - {value: federated_execution, summary: 本节点作为联邦执行者完成一次受理的执行（按执行任务号恰好一次）, label: 联邦执行, severity: neutral}
      - {value: federated_delivery,  summary: 本节点协调的联邦任务产出一份可交付结果（按根任务恰好一次，补做不重复）, label: 联邦交付, severity: neutral}

  # ---------------- 以下是企业化重构新增（control-api / 持久任务） ----------

  actor_kind:
    description: |
      调用者身份类型。corpus-api **不自己验用户凭据**，它只信任 control-api
      在内部调用里下发的 `X-DDP-Actor-Kind` + `X-DDP-Actor`。
    applies_to: [control, corpus]
    values:
      - {value: user,    summary: 浏览器会话（JWT / OIDC）, label: 用户,     severity: neutral}
      - {value: api_key, summary: sk- 开头的对外 key,       label: API Key,  severity: neutral}
      - {value: service, summary: 服务间调用（服务凭据）,   label: 服务,     severity: neutral}
      - {value: peer, summary: 已验签节点请求派生的只读主体，可在已批准子图内向直接成员转委托；不继承本地用户权限, label: 联邦节点主体, severity: neutral}

  role:
    description: |
      组织内角色（RBAC）。**首发是单组织独占部署**，一次部署 = 一份语料，
      组织内成员共享语料；角色控制的是"能做什么"，不是"能看见什么"。
    applies_to: [control]
    values:
      - {value: viewer,      summary: 只读：检索、问答、看证据,               label: 只读成员,   severity: neutral}
      - {value: contributor, summary: viewer + 上传、重解析、发起抽取,        label: 贡献者,     severity: neutral}
      - {value: reviewer,    summary: contributor + 复核队列、确认/驳回知识条目, label: 复核员,   severity: neutral}
      - {value: admin,       summary: 全部 + 成员管理、API key、配额、删除,   label: 管理员,     severity: neutral}

  task_status:
    description: |
      持久任务的状态机（§10）。**领取必须带 generation fencing**：
      lease 只解决"谁可以接管"，最终写入还要比 generation —— 否则被判死的
      旧 worker 迟到写入会覆盖新结果。
    applies_to: [worker]
    values:
      - {value: queued,    summary: 已落库等待领取,                       label: 排队中, severity: neutral, active: true}
      - {value: claimed,   summary: 已被某个 worker 领取（带 lease_until）, label: 已领取, severity: progress, active: true}
      - {value: running,   summary: 正在执行，靠 heartbeat 续租,           label: 执行中, severity: progress, active: true}
      - {value: succeeded, summary: 完成,                                 label: 已完成, severity: ok}
      - {value: failed,    summary: 失败，失败原因必须持久化并在 UI 可见,   label: 失败,   severity: error}
      - value: cancelled
        summary: |
          被显式取消。**终态，迟到的成功/失败写入一律被 generation + 状态守卫拒绝**。
          与 failed 分开是因为"用户不想要了"和"系统做砸了"对用户是两件事：
          前者不该进失败告警，后者必须留失败原因。
        label: 已取消
        severity: warn

  task_kind:
    description: 持久任务的种类。每种**分别设并发与队列**，不共用一个无量纲总并发。
    applies_to: [worker]
    values:
      - {value: parse_poll, summary: 轮询解析引擎并归档结果, label: 解析归档, severity: neutral}
      - {value: compile,    summary: 版面编译（含视觉理解）, label: 版面编译, severity: neutral}
      - {value: index,      summary: 分块 + 向量化 + 写索引, label: 建立索引, severity: neutral}
      - {value: extract,    summary: 结构化抽取批次,         label: 结构化抽取, severity: neutral}
      - {value: knowledge,  summary: 图谱 / wiki 生成,       label: 知识生成, severity: neutral}
      - {value: gc,         summary: 对象回收（带宽限期）,   label: 对象回收, severity: neutral}
      - value: federation_execute
        summary: |
          联邦节点侧的单步执行（`federation.execute`）。受理与执行行先提交、
          再排这个任务 —— 进程重启后由别的 worker 按租约接管，已受理的执行
          不会永远停在 queued/running（不变式 7）。
        label: 联邦执行
        severity: neutral
      - value: federation_plan
        summary: |
          联邦协调者推进一个已批准计划（`federation_tasks._execute_plan`）。
          与节点侧分开成两种任务，协调者等待本地执行时不会占满执行池
          （否则单池会被"等子任务的父任务"堵死）。
        label: 联邦计划执行
        severity: neutral

  upload_status:
    description: |
      直传上传会话的状态（§9.1）。**`verifying` 不能跳过**：服务端没校验完
      对象大小与摘要之前，文档不得进入解析 —— 否则等于信任客户端声明的哈希。
    applies_to: [control]
    values:
      - {value: created,   summary: 会话已创建，预签名已下发,       label: 待上传,   severity: neutral, active: true}
      - {value: uploading, summary: 客户端正在分片上传,             label: 上传中,   severity: progress, active: true}
      - {value: verifying, summary: 已 finalize，服务端正在校验摘要, label: 校验中,   severity: progress, active: true}
      - {value: ready,     summary: 校验通过，已发出 DocumentSubmitted, label: 已就绪, severity: ok}
      - {value: failed,    summary: 校验失败或客户端放弃,           label: 失败,     severity: error}
      - {value: expired,   summary: 预签名过期未完成,               label: 已过期,   severity: warn}

  ingest_status:
    description: |
      永久上传字节就绪（`upload_status=ready`）之后的**语料登记确认**：control 把
      `DocumentSubmitted` 投递给语料域，只有 2xx 或 `409 duplicate_event` 算确认。
      与 `upload_status` 是两段：`ready` 只表示已登记，**不是解析/索引完成**。
      字节未就绪、或临时计算上传时，该字段为 null。
    applies_to: [control]
    values:
      - {value: pending,  summary: 登记事件尚未得到确认（含事件尚未落库）, label: 登记中,     severity: progress, active: true}
      - {value: retrying, summary: 投递遇到暂时故障，按退避重试同一事件,   label: 登记重试中, severity: warn,     active: true}
      - {value: ready,    summary: 语料域已确认登记；解析/索引另行展示,     label: 已登记,     severity: ok}
      - {value: rejected, summary: 语料域确定性拒绝，终态，不再重投,         label: 登记被拒绝, severity: error}

  ingest_rejection:
    description: |
      `ingest_status=rejected` 时 `ingest_error` 的取值：语料域对 `DocumentSubmitted`
      的**确定性**拒绝码。投递器只把这一组当终态；其余非 2xx（含 5xx、
      `document_state_changed`、校验错误）一律按暂时故障重试 —— 把可恢复的失败
      判成终态会让一份已校验的上传永远进不了语料库。
    applies_to: [control]
    values:
      - {value: resource_not_found,      summary: 目标资源已删除、已撤回或不属于上传者, label: 目标资源不存在、已撤回或无权追加, severity: error}
      - {value: resource_version_exists, summary: 相同字节已是目标资源的一个固定版本,   label: 该内容已是目标资源的一个版本,     severity: error}
      - {value: invalid_upload_target,   summary: 目标字段非法，或临时计算上传带了目标, label: 目标资源无效,                     severity: error}
      - {value: idempotency_conflict,    summary: 同一登记键绑定了不同的输入,           label: 登记幂等键冲突,                   severity: error}
      - {value: source_missing,          summary: 内容对应的原件已不可用,               label: 原件已不可用,                     severity: error}

  wiki_stale_reason:
    description: |
      版本化 Wiki 修订 `stale_reasons` 里按页给出的原因（读时依据来源的当前状态现算）。
      页面只在它对某资源的依赖**没有一条**落在最新版本时才因新版本而过期（wiki-format）。
    applies_to: [wiki]
    values:
      - {value: source_version_changed, summary: 该页依赖的资源有了更新的固定版本,   label: 来源有了新版本,         severity: warn}
      - {value: parse_revision_changed, summary: 固定版本绑定的解析修订与依赖记录不一致, label: 来源的解析修订已变化,   severity: warn}
      - {value: source_digest_changed,  summary: 版本或原始证据的摘要与依赖记录不一致,   label: 来源原文摘要已变化,     severity: warn}
      - {value: permission_unresolved,  summary: 跨节点来源的授权无法确认,               label: 来源授权无法确认,       severity: warn}
      - {value: source_withdrawn,       summary: 依赖的固定版本已被撤回（本机工作区可撤回单个版本）, label: 来源版本已撤回, severity: warn}
      - {value: source_unavailable,     summary: 依赖的固定版本或其原始证据已读不到（删除、未就绪）, label: 来源版本不可用, severity: warn}

  # ================================================================
  # 以下是「桌面与可验证联邦路由升级计划 v3」P0 冻结的协议枚举。
  #
  # 它们**目前没有生产者** —— 联邦路由、Probe、接单、覆盖账本都还没实现
  # （见 docs/refactor/BASELINE-v3.md 的缺口表）。先声明是刻意的：
  # 计划 §9.3 要求「先定义契约，再做界面与执行器」，而这个项目吃过的最大的亏
  # 正是反过来做 —— 先写实现，枚举各处手抄，最后前端的表里没有那一项，
  # 于是那条降级/那种未完成状态**在 UI 上等于不存在**。
  #
  # ## 为什么这些轴必须各自独立，不能合成一个数字
  #
  # 计划 I08/I09 与 §7.4 反复强调同一件事：**成员枚举完整 ≠ 全文检索完成
  # ≠ 证据充分 ≠ 结论正确**。把它们压成一个绿色「完成」或一个
  # `confidence` 分数，就是这个项目在 M4a 时吃过的那个亏的联邦版本
  # （向量检索静默退回 BM25，没人发现，因为界面上只有一个"成功"）。
  #
  # 所以下面是**五个独立的轴**，界面必须分别显示：
  #   enumeration_state      成员名单封没封上
  #   retrieval_completeness 该查的目标查完没有
  #   evidence_sufficiency   拿到的证据够不够
  #   task_status（已有）    执行到哪一步
  #   validation_state       输出校验过没有
  #
  # ## 与已有枚举的关系（P0 校准结论）
  #
  # 计划 §8.1 列了 execution 轴 `queued/running/verifying/succeeded/failed/
  # cancelled`。**不新建** —— 项目已有 `task_status`（queued/claimed/running/
  # succeeded/failed，带 lease+generation fencing）。计划 §8.1 自己也写了
  # 「不要求重复创建七套状态表，已有持久任务、lease/fencing、Outbox 优先复用」。
  # `cancelled` 已经连同 worker 状态机、queue.cancel、联邦执行队列一起落地
  # （见 docs/refactor/P5-QUEUE-VALIDATION-v3.md）；仍然缺的只有 `verifying`，
  # 它等编译/校验平面的真实生产者，不在这里偷偷加一行 ——
  # 契约里有、worker 不认的值，比没有更危险。
  # ================================================================

  enumeration_state:
    description: |
      `ScopeManifest` 的成员枚举状态（计划 §5.4）。**这是「查了哪里」这句话
      的分母**：分母没封上就没有百分比可言。

      `partial` 与 `expired` 必须与 `sealed` 严格分开：把无法展开的子域
      当成空目录，等于用"那里没有资料"冒充"我没能去看"。
    applies_to: [federation, scope]
    values:
      - value: building
        summary: 正在逐个目录取分页快照，还没封存
        label: 正在确定检索范围
        severity: progress
        active: true
      - value: sealed
        summary: |
          全部获准目录都取到稳定快照且已去重封存，可重放。
          **只有这个值允许后续声明 retrieval=complete。**
        label: 检索范围已确定
        severity: ok
      - value: partial
        summary: |
          有子目录超时、拒绝或不支持枚举。未展开子域记在
          `unexpanded_subtrees[]`，**不得当成空集**，也不得给出真实总数。
        label: 检索范围不完整（部分下级目录无法展开）
        severity: warn
      - value: expired
        summary: |
          快照有效期已过或枚举游标失效。不能把不同分页时代的列表拼成
          "完整快照"（§5.5）—— 要重新枚举生成新 scope。
        label: 检索范围已过期，需重新确定
        severity: warn

  coverage_target_state:
    description: |
      覆盖账本里**单个目标**的状态（计划 §7.4）。目标键是
      `(origin_node_id, collection_id, operation)` —— 一台服务器有多个集合时，
      探测了其中一个**不能**把整台标成完成（计划 T85）。

      `unsupported` 可以结束对该目标的发现处理，但**它不表示在那里完成了
      全文检索**；报告时它进"排除数"，不进"成功检索数"。
    applies_to: [federation, coverage]
    values:
      - {value: planned,       summary: 已进入本次范围，尚未发出请求,          label: 待检索,       severity: neutral, active: true}
      - {value: in_flight,     summary: 请求已发出，还没有回执,                label: 检索中,       severity: progress, active: true}
      - {value: succeeded,     summary: 拿到有效且完成的检索回执,              label: 已检索,       severity: ok}
      - value: partial
        summary: |
          目标自己报了内部限制（分片失败、索引落后、只查了子集）。
          **算缺口，不算完成** —— 节点外层写 completed 而内部有 partial
          是计划 §6.4 明确禁止的。
        label: 部分检索（对方报告内部不完整）
        severity: warn
      - {value: denied,        summary: 鉴权通过但该目标拒绝本次操作,          label: 对方拒绝,     severity: warn}
      - {value: failed,        summary: 请求出错（非超时）,                    label: 检索失败,     severity: error}
      - value: unsupported
        summary: |
          已核实该目标不支持所需 operation。**只有可核验依据才能记这个值** ——
          能力元数据过期或缺失一律算 unknown/未完成，不得直接排除（§7.3）。
        label: 对方不支持该操作
        severity: neutral
      - {value: unreachable,   summary: 超时或连不上,                          label: 无法连接,     severity: error}
      - value: not_attempted
        summary: 预算耗尽 / 任务取消 / 范围过期导致压根没发出。**不是"没有资料"**
        label: 未检索（预算或取消）
        severity: warn
      - value: revoked
        summary: |
          成员在范围封存后被撤销。**留在分母里**（§5.5）——
          从分母删掉来把完成率做漂亮是明确禁止的。
        label: 成员已撤销（保留在范围内）
        severity: warn

  retrieval_completeness:
    description: |
      整个任务的检索完成度（计划 §7.4）。

      `complete` 的判据是**合取**，缺一条都不许写：
        ① `enumeration_state == sealed` 且无未展开子域；
        ② 所有适用且已授权的目标都返回有效、完成的回执；
        ③ 没有 in_flight / not_attempted / unreachable / denied / revoked，
           也没有任何目标自报 partial；
        ④ 每个被排除的目标都有可核验依据。

      快速模式**永远不允许**写 complete（§7.2）：它只完成了自己选中的候选，
      所以它报的是 `partial` 加上"未检索范围"。
    applies_to: [federation, coverage]
    values:
      - {value: not_started, summary: 范围还没封存或还没开始检索, label: 尚未检索, severity: neutral, active: true}
      - value: partial
        summary: |
          有目标未完成，或本轮是 fast 模式。**fast 模式的成功结局也是这个值**
          —— 它必须同时给出未检索范围，不能因为选中的候选全成功就报完成。
        label: 部分范围已检索
        severity: warn
      - value: complete
        summary: 上述四条合取全部成立。**这仍然不代表证据充分或结论正确。**
        label: 声明范围内已全部检索
        severity: ok

  evidence_sufficiency:
    description: |
      证据充分性（计划 §7.4 第三轴）。与检索完成度**严格分开**：
      「该查的都查了」和「查到的够回答」是两件事，而
      「够回答」和「答对了」又是第三件事（那一件靠人工评审，不进这个枚举）。

      `conflicting` 不是 `insufficient` 的变体：矛盾证据意味着拿到了实质内容
      但来源互相打架，界面上要让用户看见冲突，而不是折叠成"资料不足"。
    applies_to: [federation, qa, wiki]
    values:
      - value: sufficient_by_policy
        summary: |
          按当次策略判定证据足够。名字里的 `by_policy` 是刻意的 ——
          它是**按规则判的**，不是"客观上充分"，更不是 LLM 自报信心
          （§7.2 明确禁止把自报信心当唯一早停条件）。
        label: 证据满足本次策略要求
        severity: ok
      - {value: insufficient, summary: 没有足够证据支撑结论，必须如实说不足, label: 证据不足, severity: warn}
      - value: conflicting
        summary: 多来源证据互相矛盾（含同一资料的不同版本）。要展示冲突，不要挑一个。优先级低于 insufficient / unknown：证据本身不足时报不足，矛盾记录照样保留
        label: 证据存在矛盾
        severity: warn
      - {value: unknown, summary: 还没评估（检索未完成 / 评估器不可用）, label: 证据充分性未知, severity: neutral}

  evidence_conflict_basis:
    description: |
      一条证据矛盾记录**凭什么**成立（计划 §7.6：同时处理矛盾证据，不挑一个）。
      两种依据都只能把 `sufficient_by_policy` 压成 `conflicting`，**不能**抬高它，
      也**不能**把 `insufficient` / `unknown` 改写成 `conflicting`（那会藏掉"证据不足"
      并放行不该发生的生成）—— 这两种情况下矛盾记录照样保留、照样可见。
      模型说"有矛盾"最多让界面多一个警告，而模型说"没矛盾"不改变任何东西。
      每条记录都要人看（`semantic_review=needs_review`），这里记的是"值得复核的
      矛盾"，不是裁决。
    applies_to: [federation, qa, wiki]
    values:
      - value: version_divergence
        summary: |
          规则判定：同一来源（同节点、同资源）的不同固定版本在**同一定位**
          （物理页 + 块序）上取回了不同正文。只看结构，不读语义。
        label: 同一资料的版本不一致
        severity: warn
      - value: generation_reported
        summary: |
          带出处生成时模型标出的矛盾引用对。只在引用全部落在本次证据编号域、
          且至少指向两条不同证据时才采信；引用不成立则整份答案作废。
        label: 生成时标出的矛盾
        severity: warn

  federated_answer_reason:
    description: |
      联邦任务结果里 `answer_reason` 的取值：**为什么这次没有答案**（有答案时为 null）。
      它和 `evidence_sufficiency` 分开：充分性说"证据够不够"，这里说"答案这一步
      具体卡在哪" —— 证据充分但模型没装、远端答案引用越界、预算超了，都要让用户
      看得出区别，而不是统一显示成"没有答案"。

      **代码是封闭集合，细节是后缀**：其中五个代码允许带 `:细节`
      （`receipt_binding_mismatch:plan_digest`、`delegated_execution_failed:peer_execution_timeout`、
      `delegated_admission_not_accepted:waiting_input`、`delegated_answer_rejected:…`、
      `peer_unavailable:http_503`），细节是对端的状态/错误码或出错字段，经过字符集与长度
      清洗；其余代码不带后缀。对端给的字符串**永远只进细节**，不会变成新的代码。
      查文案前先去掉冒号后缀；协调者写出之前会检查代码已声明（`federation.unavailable_answer`）。
    applies_to: [federation]
    values:
      - {value: insufficient_evidence, summary: 证据不足（或没有可引用证据），不给模型凭常识补答的机会, label: 证据不足，未生成答案, severity: warn}
      - {value: local_model_missing, summary: 本节点与计划内远端都没有可用的生成能力（或生成预算为 0）, label: 没有可用的生成模型，只返回证据, severity: warn}
      - {value: source_policy_denied, summary: 规划时远端生成候选被某个选中来源集合的转交策略（onward_recipients）排除（不再探测它们的能力），其余候选也不可用；不发出证据, label: 来源不允许把证据转给生成节点，只返回证据, severity: warn}
      - {value: evidence_excerpt_unavailable, summary: 某条证据取不到正文（空白或缺失），不能拿无根片段生成, label: 有证据取不到原文片段，未生成答案, severity: warn}
      - {value: excerpt_over_contract_bound, summary: 证据正文超过契约上限（2000 字符），显式拒绝而不是静默截断, label: 证据片段超出长度上限，未生成答案, severity: warn}
      - {value: upstream_error, summary: 调生成模型的请求失败或返回非 200, label: 生成服务出错，只返回证据, severity: error}
      - {value: no_model_output, summary: 模型没有返回可用文本, label: 模型没有输出，只返回证据, severity: error}
      - {value: budget_exceeded, summary: 生成结果超出计划的生成 token 预算, label: 超出生成预算，答案作废, severity: error}
      - {value: root_budget_exhausted, summary: 本任务的根预算（请求、字节、跳数、生成 token 或截止时间）在生成这一步用完，没有拿到生成结果；不是模型输出超出 token 预算, label: 任务预算已用完，未生成答案, severity: warn}
      - {value: unsupported_generation, summary: 生成文本的引用结构不成立（无引用、越界引用、矛盾标注不成立）, label: 生成的答案引用不成立，已作废, severity: error}
      - {value: delegated_answer_missing, summary: 远端执行完成但没有返回答案文档, label: 远端没有返回答案, severity: error}
      - {value: delegated_answer_rejected, summary: 远端答案校验未通过；远端自报的原因认不出来时放进细节, label: 远端答案未通过校验, severity: error}
      - {value: delegated_bindings_missing, summary: 远端答案没有任何主张绑定, label: 远端答案没有引用，已作废, severity: error}
      - {value: delegated_binding_out_of_scope, summary: 远端答案的引用不在本次发送的证据里, label: 远端答案引用了未发送的证据，已作废, severity: error}
      - {value: delegated_conflict_out_of_scope, summary: 远端标出的矛盾引用不在本次发送的证据里, label: 远端标注的矛盾引用不成立，答案已作废, severity: error}
      - {value: evidence_delegation_over_limit, summary: 要委托的证据条数超过受理上限，不截断证据去凑数, label: 证据条数超过委托上限，未生成答案, severity: warn}
      - {value: invalid_admission_receipt, summary: 远端受理回执缺执行任务号, label: 远端受理回执无效, severity: error}
      - {value: receipt_binding_mismatch, summary: 远端回执与本次 root/step/幂等键/计划修订/执行者对不上；细节是出错字段（回执不是对象时为 schema）, label: 远端回执与本次任务对不上，未采用, severity: error}
      - {value: delegated_admission_not_accepted, summary: 远端没有受理答案步骤；细节是回执状态（如 waiting_input / rejected）, label: 远端未受理生成请求, severity: error}
      - {value: delegated_execution_failed, summary: 远端答案执行没有成功；细节是对端错误码或状态（含本节点轮询超时 peer_execution_timeout）, label: 远端生成步骤未完成, severity: error}
      - {value: peer_unavailable, summary: 远端生成节点未登记、连不上、回 HTTP 错误或返回非法响应；细节是对端错误码、http_状态或 transport, label: 远端生成节点不可用, severity: error}

  federation_task_operation:
    description: |
      协调者入口（`POST /api/v1/task-intents`）**受理哪些 TaskSpec.operation**。
      这是一个闭集：认不出来的 operation 当场拒绝，不许落库。

      为什么必须闭集：规划只按 operation 决定要不要加生成步骤。以前不看 operation，
      本地模型就绪时**任何** operation 都会被追加一个 `answer` 步 —— 提交
      `corpus.retrieve`（只取证据）会白跑一次生成；未登记的操作必须明确拒绝，
      不得用 RAG 答案冒充其他业务产物。

      本地运行时的 TaskSpec 还有别的 operation（本机自己的计划许可），不受这里约束。
    applies_to: [federation]
    values:
      - {value: corpus.retrieve, summary: 只按范围取证据，不生成结论, label: 只取证据, severity: neutral}
      - {value: rag.answer.cited, summary: 取证据并生成带出处的回答, label: 带出处的回答, severity: neutral}
      - {value: wiki.pages, summary: 按固定原始证据生成并验证版本化 Wiki 草稿, label: 构建 Wiki 草稿, severity: neutral}

  plan_step_operation:
    description: 已登记的类型化执行步骤；delegate 只协调分配的叶目标，不扩权。
    applies_to: [federation, plans]
    values:
      - {value: parse, summary: 解析固定输入, label: 解析, severity: neutral}
      - {value: index, summary: 构建本域索引, label: 索引, severity: neutral}
      - {value: retrieve, summary: 本域检索, label: 检索, severity: neutral}
      - {value: delegate, summary: 用非重叠预算份额协调子树, label: 子树委托, severity: neutral}
      - {value: fuse, summary: 融合取回证据, label: 融合, severity: neutral}
      - {value: rerank, summary: 对证据重排, label: 重排, severity: neutral}
      - {value: answer, summary: 生成带引用答案, label: 回答, severity: neutral}
      - {value: source_manifest, summary: 固定来源清单, label: 来源清单, severity: neutral}
      - {value: wiki_pages, summary: 生成 Wiki 页面, label: Wiki 页面, severity: neutral}
      - {value: validate, summary: 校验输出, label: 校验, severity: neutral}
      - {value: deliver, summary: 交付固定结果, label: 交付, severity: neutral}

  task_event_type:
    description: |
      联邦任务事件流（`GET /api/v1/tasks/{root_task_id}/events`）里 `Event.type` 的取值。
      事件是**可恢复的进度记录**，不是状态真相：状态以 `TaskStatus` 各轴为准，事件用来
      让界面说清"发生了什么、什么时候"，断线后按 `after=next_seq` 续读不丢。
    applies_to: [federation]
    values:
      - {value: intent_created, summary: 任务需求与探索许可已落库, label: 已创建任务, severity: neutral}
      - {value: plan_ready, summary: 规划完成（Probe 与计划修订已生成），等待批准, label: 计划已生成，等待批准, severity: neutral}
      - {value: plan_approved, summary: 用户批准了这一修订与执行许可, label: 已批准计划, severity: ok}
      - {value: execution_started, summary: 执行已受理并排入持久队列, label: 开始执行, severity: progress}
      - {value: task_resumed, summary: 重新判权后补做未完成目标（执行代次 +1）, label: 补做未完成目标, severity: progress}
      - {value: task_completed, summary: 执行结束且至少有目标产出证据（查全与否看覆盖账本）, label: 执行结束, severity: ok}
      - {value: task_failed, summary: 执行失败（没有任何目标产出证据，或协调者被清扫）, label: 执行失败, severity: error}
      - {value: task_cancelled, summary: 用户显式取消；终态，迟到结果不许覆盖, label: 已取消, severity: warn}
      - {value: delivery_pending, summary: 结果已固化为交付文档，等待下载后校验确认, label: 结果待确认, severity: neutral}
      - {value: delivery_confirmed, summary: 客户端校验摘要后确认了交付, label: 结果已确认, severity: ok}
      - {value: delivery_expired, summary: 交付在有效期内没有被确认, label: 结果交付已过期, severity: warn}

  planning_state:
    description: |
      TaskPlan 的规划轴（计划 §8.1）。`invalidated` 是关键一态：
      计划过期、输入版本变了、授权被撤销之后，**旧计划不许被执行**，
      要重新规划并重新批准（§6.6 接单时重新检查）。
    applies_to: [federation, task]
    values:
      - {value: draft,             summary: TaskSpec 已建，还没探测,                 label: 草稿,         severity: neutral, active: true}
      - {value: exploring,         summary: 已获探索许可，正在 Probe,                label: 正在探测,     severity: progress, active: true}
      - {value: ready,             summary: 计划已生成，等待用户批准外发边界,        label: 计划待批准,   severity: neutral, active: true}
      - {value: awaiting_approval, summary: 计划变化超出原许可，暂停等重新批准,      label: 等待重新批准, severity: warn,    active: true}
      - {value: approved,          summary: 计划与外发边界都已批准，可以接单,        label: 已批准,       severity: ok}
      - value: invalidated
        summary: 计划过期、输入版本变更或授权撤销。**不得凭旧 Probe 放行**
        label: 计划已失效，需重新规划
        severity: warn

  admission_state:
    description: |
      远端执行者的受理轴（计划 §8.1 / §6.6）。

      **`unknown` 不等于「没执行」** —— 这是计划 T82 专门要求的区分：
      回执丢了要先按幂等键对账，不能立刻把有副作用的步骤换个节点重做。
    applies_to: [federation, task]
    values:
      - {value: not_submitted, summary: 还没提交给执行者,                                 label: 未提交,   severity: neutral}
      - value: waiting_input
        summary: |
          受理会话已建、等输入上传完（§6.6）。**这一态不占 GPU** ——
          输入没齐就排队等于占着卡等上传。
        label: 等待输入上传
        severity: progress
        active: true
      - {value: checking,     summary: 服务端正在校验输入摘要与格式,                     label: 校验输入中, severity: progress, active: true}
      - {value: accepted,     summary: 已持久受理并返回 AdmissionReceipt（≠ 算力预留）,   label: 已受理,   severity: ok,      active: true}
      - {value: rejected,     summary: 明确拒绝（授权、计划过期、输入不合格、配额）,       label: 被拒绝,   severity: error}
      - value: unknown
        summary: |
          请求发出了但回执丢失。**必须按幂等键查询对账**，查到已有任务就用它；
          不得增加逻辑执行代次，也不得重复计一次成功交付。
        label: 受理状态未知（正在对账）
        severity: warn
        active: true

  validation_state:
    description: |
      输出验收轴（计划 §8.1 / §4.3 两层引用校验）。

      **结构校验通过 ≠ 内容正确**：`passed` 只表示引用确实存在、版本对得上、
      定位可授权解析；"原文是否真的支持这个结论"是 `needs_review`
      要人看的那件事（计划 §14.3 主张支持度，明确不能用引用存在率替代）。
    applies_to: [federation, qa, wiki]
    values:
      - {value: pending,      summary: 还没校验,                                     label: 待校验,     severity: neutral, active: true}
      - {value: passed,       summary: 结构校验通过：引用存在、版本正确、定位可解析,   label: 校验通过,   severity: ok}
      - {value: failed,       summary: 结构校验不通过（虚构引用 / 错版本 / 无权定位）, label: 校验未通过, severity: error}
      - {value: needs_review, summary: 需要人工复核语义支持度或冲突,                 label: 需人工复核, severity: warn}

  delivery_state:
    description: |
      交付轴（计划 §8.3）。**计算成功不代表本地拿到结果。**

      `expired` 必须能显示出来：TTL 到期导致未领取结果失效时，界面上
      **不许**仍然显示"已保存本地"（计划 §8.3 原文要求）。
    applies_to: [federation, task]
    values:
      - {value: not_requested, summary: 不需要回传（结果留在中心）,               label: 无需交付,   severity: neutral}
      - {value: pending,       summary: 结果已就绪，等待本地领取,                 label: 待领取,     severity: neutral, active: true}
      - {value: transferring,  summary: 正在下载,                                 label: 传输中,     severity: progress, active: true}
      - {value: confirmed,     summary: 本地校验 manifest 与文件后已幂等确认,      label: 已交付,     severity: ok}
      - value: expired
        summary: 暂存 TTL 到期，结果已失效。**不得显示成已保存本地**
        label: 交付已过期（结果未领取）
        severity: error

  retention_class:
    description: |
      数据保留类别（计划 §8.1 / §8.3）。**临时处理不自动进入永久语料库** ——
      远端算一次不等于对方获得了这份资料的长期副本。

      `task_pinned` 是给 GC 看的：引用仍被活跃任务或他人合法产物使用时，
      GC 不能删唯一副本（计划 §8.3 末段，项目已有的 `gc.py` 宽限期同理）。
    applies_to: [federation, retention]
    values:
      - {value: temporary,   summary: 临时输入/中间产物，按 TTL 清理,        label: 临时数据,   severity: neutral}
      - {value: task_pinned, summary: 被活跃任务引用，GC 不得回收,           label: 任务占用中, severity: neutral}
      - {value: persistent,  summary: 已按授权进入永久语料,                  label: 永久保存,   severity: ok}
      - {value: deleting,    summary: 正在清理（宽限期内可能仍可见）,        label: 正在清理,   severity: progress, active: true}
      - {value: deleted,     summary: 已清理,                                label: 已删除,     severity: neutral}

  publishing_state:
    description: |
      发布轴（计划 §8.1 / §4.4）。**私有来源的派生页面不能靠切 public 绕过
      原许可** —— 发布前要检查派生内容的公开权（计划 §4.4、T06）。
    applies_to: [federation, wiki, resource]
    values:
      - {value: private,   summary: 仅所有者与获授权者可见,           label: 私有,     severity: neutral}
      - {value: draft,     summary: 草稿，未发布,                     label: 草稿,     severity: neutral}
      - {value: published, summary: 已按授权范围发布,                 label: 已发布,   severity: ok}
      - {value: withdrawn, summary: 已撤回。**不承诺收回已下载副本**, label: 已撤回,   severity: warn}

  capability_readiness:
    description: |
      节点能力的就绪度（计划 §5.2）。**三件事必须分开记**：
      静态能力配置、周期健康探测、本次任务预检。

      `configured` 不代表能用：计划原文举的例子是 `gpu=true` 不代表
      所需模型已经就绪 —— 这正是本项目踩过的坑的联邦版本
      （注册表里有 OCR 专用模型，抽取平面拿它去抽值，抽不出来被记成
      `not_found`，系统能力缺失伪装成"文档里没有"，见已有的 `no_instruct`）。
    applies_to: [federation, discovery]
    values:
      - value: configured
        summary: 配置里声明了这个能力，但没有健康证据。**不得当成可用**
        label: 已配置（未验证可用）
        severity: neutral
      - {value: ready,     summary: 健康探测通过且当前可接单,                 label: 可用,       severity: ok}
      - {value: draining,  summary: 正在排空，不接新单但在跑的会做完,         label: 正在排空,   severity: warn}
      - {value: unhealthy, summary: 健康探测失败,                             label: 不可用,     severity: error}
      - value: unknown
        summary: |
          没有有效的健康证据（从没探过 / 记录过期）。
          **过期记录不是当前能力证明**（§5.5），要按未知处理，不许按
          最后一次成功当成现在可用。
        label: 能力状态未知
        severity: warn

  input_validation:
    description: |
      Probe 的输入校验深度（计划 §6.4 / T78）。**这两个值的区别是钱**：
      只看了文件描述就放进 admission，等于信任客户端声明的哈希 ——
      本项目在直传上传那里已经踩过同一个坑（upload_status 的 `verifying`
      不能跳过），联邦侧是同一条规则。
    applies_to: [federation, probe]
    values:
      - value: metadata_only
        summary: |
          只校验了声明的格式/大小/类型，**没收到内容**。
          上传阶段只能是这个值，且此时不得占 GPU。
        label: 仅校验元数据
        severity: warn
      - value: content_verified
        summary: 已收到内容并自己算过摘要校验通过。**预检仍不能排除运行时 OOM 或坏页**
        label: 已校验内容
        severity: ok

  search_mode:
    description: |
      检索模式（计划 §6.3 / §7）。**mode 决定怎么查，scope 决定查哪些** ——
      两者不许互相覆盖：`fast` 不能缩小用户固定的资源范围，
      `local_first`（排序偏好）也不能偷偷变成 `local_only`（外发策略）。
    applies_to: [federation, search]
    values:
      - value: fast
        summary: |
          有界选点：摘要排序 + 少量并行 Probe + 有条件扩展。
          **结局最多是 retrieval=partial**，必须报告未检索范围。
        label: 快速检索（部分范围）
        severity: neutral
      - value: exhaustive_scope
        summary: |
          按封存的 ScopeManifest 逐个目标实际探测。摘要只影响顺序、不删成员。
          即使已经拿到好答案也继续做完，除非用户取消（§7.3）。
        label: 范围穷查
        severity: neutral

  transport_state:
    description: |
      `client-runtime` 的连接状态（计划 §3.4）。**与数据状态分开**
      （数据状态见 `snapshot_state`）—— 合起来的后果是
      "一个无关面板订阅失败把整个界面标成服务器断开"，计划明确禁止。

      每个 `(environment_id, authenticated_profile_id)` 只有**一个**重连
      负责人（计划 T66）；界面组件只订阅状态，不各自开重连循环。
    applies_to: [client, desktop]
    values:
      - {value: disconnected,   summary: 未连接,                                     label: 未连接,     severity: neutral}
      - {value: connecting,     summary: 正在建立连接,                               label: 连接中,     severity: progress, active: true}
      - {value: authenticating, summary: 连上了，正在认证,                           label: 认证中,     severity: progress, active: true}
      - {value: ready,          summary: 可用,                                       label: 已连接,     severity: ok}
      - {value: backoff,        summary: 有限退避等待重试,                           label: 等待重连,   severity: warn,     active: true}
      - value: blocked
        summary: 认证失效或被拒，**不再自动重试**（避免无休止刷新，T66）
        label: 连接被拒绝（需重新配对）
        severity: error

  snapshot_state:
    description: |
      客户端缓存投影的数据状态（计划 §3.4）。与 `transport_state` 分开的理由
      在那条里。`stale` 要能显示：断网时可以看已取得的本地内容，
      但**不能显示假在线**（计划 §3.2）。
    applies_to: [client, desktop]
    values:
      - {value: loading, summary: 首次取快照中,                                    label: 加载中,       severity: progress, active: true}
      - {value: current, summary: 与服务端游标一致,                                label: 最新,         severity: ok}
      - value: stale
        summary: 连接中断或游标落后，显示的是旧数据。**不得显示成在线最新**
        label: 数据可能已过期
        severity: warn
      - {value: failed,  summary: 取快照失败（游标失效时应重新取快照而不是永久等）, label: 数据加载失败, severity: error}

  federation_error:
    description: |
      联邦协议的机器可读错误码（计划 §9.6）。

      **命名对齐项目既有约定**：计划正文写的是 SCREAMING_CASE，这里统一成
      snake_case —— 项目所有错误码（`invalid_request_error`、`quota_error` …）
      与所有枚举都是 snake_case，而生成器也只接受 snake_case。
      同一个概念两种拼法就是漂移的开始，所以在 P0 一次定死。

      **对外降敏**：不得借错误码暴露私有资源是否存在（§8.4）——
      无权主体看到的应该是"找不到"而不是"存在但你没权限"。

      **`unreachable` 类错误绝不能被前端翻译成「对方没有资料」**（§9.6 原文）：
      那是把"我没查到"说成"那里没有"。
    applies_to: [federation]
    values:
      - {value: discovery_incomplete,  summary: 成员枚举没能封存，覆盖承诺随之降级,                label: 节点范围未能完整确定,       severity: warn}
      - {value: scope_expired,         summary: ScopeManifest 过期，需重新枚举生成新 scope,        label: 检索范围已过期,             severity: warn}
      - value: capability_unknown
        summary: 没有有效健康证据。**与 unsupported 严格分开** —— 未知要去预检，不是排除
        label: 对方能力未知（需预检）
        severity: warn
      - {value: capability_unsupported, summary: 已核实不支持所需 operation,                       label: 对方不支持该操作,           severity: neutral}
      - {value: input_not_verified,    summary: 输入摘要/格式还没校验通过就想进 admission,         label: 输入尚未校验通过,           severity: error}
      - value: egress_denied
        summary: |
          外发许可不覆盖这次发送（接收方、内容或有效期超界）。
          `local_only` 命中时也是这个码 —— 它高于所有自动回退（§6.2）。
        label: 该数据不允许发往此接收方
        severity: error
      - {value: plan_changed,          summary: 计划修订变了，原批准不再适用,                      label: 执行计划已变更，需重新批准, severity: warn}
      - {value: offer_expired,         summary: Offer 有效期已过（Offer 本来就不预留算力）,        label: 执行意向已过期,             severity: warn}
      - value: admission_unknown
        summary: 受理状态不明。**不等于未执行**，要按幂等键对账（T82）
        label: 受理状态未知（正在对账）
        severity: warn
      - value: idempotency_conflict
        summary: 同一幂等键对应不同请求正文。**返回冲突，不许复用不相关结果**（T80）
        label: 幂等键冲突（请求内容不一致）
        severity: error
      - {value: partial_retrieval,     summary: 检索只完成了一部分，覆盖账本里有缺口,              label: 检索未覆盖全部范围,         severity: warn}
      - {value: insufficient_evidence, summary: 本次范围与配置下没拿到足够证据,                    label: 证据不足,                   severity: warn}
      - {value: budget_exhausted,      summary: 根预算用尽（含发现与 Probe 的消耗）,               label: 预算已用尽,                 severity: warn}
      - {value: source_revoked,        summary: 来源被撤销或转为私有，停止新授权并重判派生依赖,     label: 来源已撤销,                 severity: warn}
      - {value: delivery_expired,      summary: 结果暂存 TTL 到期未领取,                           label: 结果已过期未领取,           severity: error}
      - value: local_model_missing
        summary: |
          本地缺所需模型。**必须明确报出来**，不得悄悄请求远端（I03 / T18）——
          这正是项目已有的 `no_instruct_model` 在本地模式下的对应物。
        label: 本地缺少所需模型
        severity: error
      - {value: protocol_incompatible, summary: 协议版本或必需字段不兼容，明确拒绝而不是忽略后乱执行, label: 协议版本不兼容,             severity: error}
      - value: task_cancelled
        summary: |
          对已取消任务调用 resume。**取消是显式终态，不得被"恢复"改写回
          running** —— 重跑必须是一条新任务（新授权、新覆盖分母），而不是
          拿旧计划接着跑。返回 409，任务状态原样不动。
        label: 任务已取消，不能恢复
        severity: error
      # ---- 节点凭证（DDP-NODE-CREDENTIAL，计划 §8.4 / T32 / T43）----
      # 401 一族：这张凭证本身不能用；403 一族：凭证有效但不覆盖这次请求。
      # **节点认证通过不是资源权限**：凭证全部通过之后执行者仍按自己的
      # 资源 ACL 判权，无权照旧是同形 404，不在这里另起一个码。
      - value: credential_invalid
        summary: |
          节点凭证缺失字段、不是规范序列化、base64 不严格、算法不是 Ed25519、
          有效期超过上限，或签名验不过（篡改）。一律 401，不区分是哪一步 ——
          分开报等于给伪造者一个逐步试错的口。
        label: 节点凭证无效
        severity: error
      - {value: credential_expired,  summary: 凭证已过期或签发时间在未来（超出时钟偏差容忍）, label: 节点凭证已过期, severity: error}
      - value: credential_replayed
        summary: |
          同一个 jti 第二次出现。凭证是**单次使用**的：执行者在验签通过后
          持久记下 jti 直到过期，并发重放由唯一约束仲裁（401）。
        label: 节点凭证被重放
        severity: error
      - value: credential_audience_mismatch
        summary: 凭证的 audience 不是接收它的这个节点。转手给第三个节点（越权转委托）就是这个码
        label: 凭证不是发给本节点的
        severity: error
      - {value: credential_operation_denied, summary: 凭证授权的操作不是本端点的操作（403）, label: 凭证不允许该操作, severity: error}
      - value: credential_scope_denied
        summary: |
          凭证的请求绑定（方法/路径/正文摘要）或范围约束（root_task_id / step_id /
          scope_ref / task_spec_digest）不覆盖这次请求或它要读的那一行（403）；
          以别的协调者名义提交计划也是这个码。
        label: 凭证范围不覆盖该请求
        severity: error
      - value: node_unknown
        summary: 签发节点不在本节点控制面的成员目录里，或尚未被管理员批准（401）
        label: 未知或未批准的节点
        severity: error
      - value: node_revoked
        summary: 签发节点已被管理员撤销。撤销对新请求生效的延迟以公钥缓存上限为界（401）
        label: 节点已被撤销
        severity: error
      - value: node_identity_mismatch
        summary: |
          语料服务配置的节点身份（BUNDLE_NODE_ID）与控制面持久密钥派生的身份不一致，
          或控制面报告的本节点身份变了。**Fail Closed（503）**：否则本地目标会被当成远端
        label: 本节点身份不一致（联邦已停用）
        severity: error
      - {value: node_identity_unavailable, summary: 还没从控制面取到本节点持久身份（503），联邦端点与出站一律拒绝, label: 本节点身份尚未确定, severity: error}
      - value: node_identity_unconfigured
        summary: |
          没有可用的本节点身份配置（503）：shared 开发档位或测试跟随模式下
          BUNDLE_NODE_ID 为空或形状不对。先配好持久身份再谈联邦。
        label: 本节点身份未配置
        severity: error
      - value: credential_unavailable
        summary: |
          本节点控制面在凭证链路上不可用：出站时签不出凭证（不可达、拒签、响应形状不对），
          或入站时查不到签发节点的信任记录（503）。**是本节点的问题，不是对端没有资料**
          —— 协调者记 unreachable 并保留可重试。
        label: 本节点凭证服务不可用
        severity: error

  node_credential_operation:
    description: |
      一张节点凭证授权的**唯一**操作（DDP-NODE-CREDENTIAL）。每个节点对节点
      端点恰好对应一个值；凭证只签一个操作，拿读执行状态的凭证去受理任务是
      `credential_operation_denied`。
    applies_to: [federation, discovery]
    values:
      - {value: probe_create,      summary: 'POST /api/v1/federation/probes',                        label: 发起探测,       severity: neutral}
      - {value: probe_read,        summary: 'GET /api/v1/federation/probes/{probe_id}',              label: 读取探测回执,   severity: neutral}
      - {value: admission_create,  summary: 'POST /api/v1/federation/admissions',                    label: 提交接单,       severity: neutral}
      - {value: admission_lookup,  summary: 'POST /api/v1/federation/admissions/lookup',             label: 对账接单,       severity: neutral}
      - {value: execution_read,    summary: 'GET /api/v1/federation/tasks/{executor_task_id}',       label: 读取执行状态,   severity: neutral}
      - {value: execution_cancel,  summary: 'POST /api/v1/federation/tasks/{executor_task_id}/cancel',  label: 取消执行,    severity: neutral}
      - {value: evidence_set_read, summary: 'GET /api/v1/federation/evidence-sets/{set_ref}',        label: 读取证据集,     severity: neutral}
      - {value: resource_locate,   summary: 'POST /api/v1/federation/resources/locate',              label: 定位资源版本,   severity: neutral}
      - {value: result_resolve,    summary: 'POST /api/v1/federation/results/resolve',               label: 解析证据引用,   severity: neutral}
      - {value: catalog_read,      summary: 'GET /api/v1/federation/published-collections',          label: 读取发布目录,   severity: neutral}
      - {value: directory_members_read, summary: 'GET /api/v1/federation/members',                  label: 读取目录成员,   severity: neutral}
      - {value: directory_subtree_read, summary: 'GET /api/v1/federation/subtree',                  label: 读取目录子树,   severity: neutral}
      - {value: directory_collections_read, summary: 'GET /api/v1/federation/collections',          label: 读取目录集合,   severity: neutral}
      - {value: directory_capabilities_read, summary: 'GET /api/v1/federation/generation-descriptor', label: 读取生成能力, severity: neutral}

  peer_auth_mode:
    description: |
      语料服务节点对节点端点的认证方式。唯一取值 `node_credential`：控制面持有
      节点私钥，按请求签发限定 audience/actor/操作/范围/有效期的单次凭证。
      旧的共享口令形态已删除，不再有兼容取值。
    applies_to: [federation]
    values:
      - value: node_credential
        summary: 控制面持有节点私钥，按请求签发限定 audience/actor/操作/范围/有效期的单次凭证
        label: 节点签名凭证
        severity: ok

  node_membership_state:
    description: 控制域管理员批准的直接节点成员状态，批准不授予资源权限或证明远端持有密钥。
    applies_to: [discovery]
    values:
      - {value: pending, summary: 已登记但管理员尚未批准, label: 待批准, severity: neutral}
      - {value: approved, summary: 管理员已批准配置，健康与接单另行判断, label: 已批准, severity: ok}
      - {value: revoked, summary: 已撤销，保留旧快照成员位置且禁止旧修订恢复, label: 已撤销, severity: warn}

  member_expansion_state:
    description: 单目录快照中的下级枚举状态，不声明递归全局覆盖。
    applies_to: [discovery]
    values:
      - {value: not_requested, summary: 成员支持枚举但尚未请求下级目录, label: 尚未展开, severity: neutral}
      - {value: unexpanded_subtree, summary: 下级不可枚举，不等于空目录, label: 下级未展开, severity: warn}
      - {value: source_revoked, summary: 原快照成员已撤销或当前调用者不可见, label: 来源已撤销, severity: warn}

  source_state:
    description: |
      桌面端数据源的状态（DESKTOP-APPSHELL-PLAN §1.6）。
      与 `transport_state` 分开：那条是 client-runtime 的连接状态，
      这里是"当前数据源能不能按其能力读写" —— 本机工作区与已连接中心各自一态。
    applies_to: [client, desktop]
    values:
      - {value: ready,      summary: 数据源可用，可按其能力读写,                   label: 可用,         severity: ok}
      - {value: connecting, summary: 正在连接（本机运行时启动中或中心登录握手中）, label: 连接中,       severity: progress, active: true}
      - {value: signed_out, summary: 中心登录已过期，需重新连接该中心,             label: 需要重新登录, severity: warn}
      - {value: unavailable, summary: 数据源不可用（本机运行时起不来或中心不可达）, label: 不可用,       severity: error}

  source_error:
    description: |
      桌面端数据源错误的机器可读码（宿主 `/api` 代理与数据源具名方法返回）。
      命名对齐项目既有约定（snake_case）。`approved_plan_required` 是中心只读的
      写拒绝：不是权限不足，而是写必须走联邦任务、经原生对话框批准后派发。
    applies_to: [client, desktop]
    values:
      - value: no_active_source
        summary: 还没有任何当前数据源（首运或全部移除后），/api 直接 503
        label: 还没有选择数据源
        severity: error
      - value: approved_plan_required
        summary: 中心源只放行 GET/HEAD；写操作须作为联邦任务发起并经批准派发
        label: 中心在桌面里只读；写操作请作为联邦任务发起并批准
        severity: error
      - value: source_signed_out
        summary: 中心 JWT 过期（上游 401），该源变为"需要重新登录"
        label: 登录已过期，请重新连接该中心
        severity: error
      - value: source_changed
        summary: 在途请求返回时当前源已切换，页面丢弃该响应
        label: 数据源已切换，此结果已丢弃
        severity: error
      - value: not_supported_locally
        summary: 本机工作区没实现这项中心接口（发布、重解析等）
        label: 本机工作区不支持这项功能
        severity: error
  desktop_error:
    description: |
      桌面端渲染进程的本机错误码（旧工作台 `platform/desktop.ts` 的 `reasons` 表搬入）。
      命名对齐项目既有约定（snake_case）。这些码来自宿主具名方法与本地账本，
      不是中心契约：含义只在"本机工作区 + 已配对中心"这套桌面链路下成立。
      宿主 HostError、文件安全检查 code 选项与 fail 调用的用户文案由架构守卫检查，
      包含直接字面量与条件分支返回码；含 smoke 的码、development_* 与
      invalid_development_url 仅用于内部诊断，不提供用户标签。
    applies_to: [client, desktop]
    values:
      - value: unsafe_runtime_directory
        summary: 本机运行时私有目录不是普通目录、是符号链接或 POSIX 权限与所有者不安全
        label: 本机运行时目录未通过安全检查，无法启动，请联系维护者检查目录类型、权限和所有者。
        severity: error
      - value: unsafe_credential_directory
        summary: 凭证私有目录不是普通目录、是符号链接或 POSIX 权限与所有者不安全
        label: 凭证目录未通过安全检查，无法保存或读取凭证，请联系维护者检查目录类型、权限和所有者。
        severity: error
      - value: unsafe_client_directory
        summary: 客户端私有目录不是普通目录、是符号链接或 POSIX 权限与所有者不安全
        label: 桌面客户端目录未通过安全检查，无法启动客户端，请联系维护者检查目录类型、权限和所有者。
        severity: error
      - value: client_configuration_invalid
        summary: 客户端连接配置文件不安全、无法读取或内容无效，宿主初始化客户端层失败
        label: 桌面客户端配置无法读取或不安全，无法启动客户端，请联系维护者检查配置文件。
        severity: error
      - value: connection_limit
        summary: 注册新连接时已保存的连接数达到 64 个上限
        label: 已保存的数据源连接达到上限，请移除不再使用的数据源后再连接。
        severity: warn
      - value: credential_required
        summary: 宿主执行需要凭证的操作时未找到当前环境与身份的凭证
        label: 当前身份没有可用凭证，无法执行此操作，请重新认证。
        severity: warn
      - value: credential_unavailable
        summary: 凭证读取、安全检查或解密失败，或操作期间凭证会话已失效
        label: 当前凭证无法安全读取或会话已失效，请重新认证后再操作。
        severity: error
      - value: export_target_changed
        summary: 导出写入前目标文件的类型、设备、inode、大小或修改时间与选择时不一致
        label: 导出目标文件已变化，已阻止覆盖，请重新选择保存位置。
        severity: warn
      - value: file_changed
        summary: 导入读取未完成或读取前后文件大小、修改时间、状态变更时间不一致
        label: 导入文件在读取期间发生变化，请停止修改文件后重新选择导入。
        severity: warn
      - value: file_operation_failed
        summary: 文件请求返回未单独分类的失败状态或没有响应体
        label: 文件请求失败，无法取得有效响应，请检查数据源状态后再操作。
        severity: error
      - value: file_too_large
        summary: 文件响应超过 32 MiB，或导入对象不是非空普通文件或超过 32 MiB
        label: 文件不符合读取限制，请选择非空普通文件并确保大小不超过 32 MiB。
        severity: error
      - value: host_closing
        summary: 宿主正在关闭或已关闭，不再受理连接、工作区或运行时操作
        label: 桌面宿主正在关闭，无法受理此操作，请重新打开应用后再操作。
        severity: neutral
      - value: invalid_bundle
        summary: Bundle 类型、大小或验证结果无效，或运行时无法完成 Bundle 验证
        label: Bundle 格式不符合要求或验证未完成，请检查文件及本机运行时状态。
        severity: error
      - value: invalid_credential
        summary: 设置凭证时密钥为空、过长、含控制字符或持久化参数不是布尔值
        label: 中心返回的登录凭证无法由桌面端保存，请联系中心管理员检查凭证格式。
        severity: error
      - value: invalid_endpoint
        summary: 中心地址或存储源地址无法解析，含禁止字段或不满足 HTTPS 与源地址格式要求
        label: 中心或存储地址不符合安全要求，请使用 HTTPS 并移除嵌入凭证、查询参数和片段，且对象存储源地址只能包含协议、主机及可选端口，不能包含路径。
        severity: error
      - value: invalid_identity
        summary: 凭证操作的环境或身份标识符格式无效
        label: 环境或身份标识不符合要求，无法处理凭证，请重新连接数据源后再操作。
        severity: error
      - value: invalid_pdf
        summary: 导入或读取的原件缺少 PDF 文件头，或响应类型不是 application/pdf
        label: 文件或原件响应不是有效的 PDF，无法继续处理，请检查所选文件或数据源原件。
        severity: error
      - value: invalid_runtime_session
        summary: WSL 运行时启动时未提供非空宿主会话目录
        label: 本机运行时缺少有效会话目录，无法启动，请联系维护者检查宿主配置。
        severity: error
      - value: invalid_workspace
        summary: 工作区标识、原生目录类型或 WSL 工作区路径不符合宿主校验要求
        label: 工作区标识或目录不符合要求，无法打开，请重新选择有效的工作区。
        severity: error
      - value: invalid_wsl_distro
        summary: 选择的 WSL 分发名称不符合安全字符格式
        label: WSL 分发名称不符合要求，无法使用本机工作区，请检查分发配置并重新启动 DeepDocParse。
