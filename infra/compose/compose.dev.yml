# 本机开发的完整栈（无 GPU 版）。有 GPU 的加 compose.gpu.yml。
#
#   docker compose -f infra/compose/compose.dev.yml --env-file infra/env/dev.env up -d
#
# **项目名钉死**：compose 缺省取目录名，而两个 compose 目录同名会让
# 同名服务互相顶掉（旧仓库实测发生过：起 service 侧的 redis 把 web 那个
# 容器直接换掉，Web 后端随即失联）。
name: ddp

x-python-build: &python-build
  context: ../..
  dockerfile: infra/images/python-base.Dockerfile
  args:
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

x-corpus-env: &corpus-env
  DATABASE_URL: postgresql+asyncpg://ddp_corpus:${CORPUS_DB_PASSWORD:-ddp}@postgres:5432/deepdocparse
  SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN 必须显式设置}
  SERVICE_URL: http://model-gateway:9000
  CONTROL_URL: http://control-api:8080
  PUBLIC_BASE_URL: http://corpus-api:8081
  MINIO_INTERNAL_ENDPOINT: minio:9000
  MINIO_PUBLIC_ENDPOINT: ${OBJECT_PUBLIC_ENDPOINT:-127.0.0.1:19000}
  MINIO_ACCESS_KEY: ${OBJECT_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${OBJECT_SECRET_KEY:?OBJECT_SECRET_KEY 必须显式设置}
  MINIO_BUCKET: deepdocparse
  REDIS_URL: redis://redis:6379/0
  DEFAULT_PARSE_ENGINE: ${DEFAULT_PARSE_ENGINE:-borndigital}

services:
  # ------------------------------------------------------------ 数据面
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ddp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ddp}
      POSTGRES_DB: deepdocparse
    ports: ["15432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ddp"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${OBJECT_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${OBJECT_SECRET_KEY:?OBJECT_SECRET_KEY 必须显式设置}
    ports: ["19000:9000", "19001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis/redis-stack-server:7.4.0-v3
    ports: ["16379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------- 迁移（一次性）
  # **两套迁移各管各的 schema**，互不依赖：control 由 Go 的迁移器跑，
  # corpus 由 alembic 跑。谁先谁后都行 —— 因为没有跨 schema 外键
  corpus-migrate:
    build:
      <<: *python-build
      target: migrate
    environment:
      DATABASE_URL: postgresql+asyncpg://ddp:${POSTGRES_PASSWORD:-ddp}@postgres:5432/deepdocparse
      ALLOW_INSECURE_DEFAULTS: "true"     # 一次性容器，不需要真凭据
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  # ------------------------------------------------------------- 控制面
  control-api:
    build:
      context: ../..
      dockerfile: infra/images/control-api.Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    environment:
      CONTROL_DATABASE_URL: postgres://ddp:${POSTGRES_PASSWORD:-ddp}@postgres:5432/deepdocparse
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET 必须显式设置且不短于 32 字节}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN 必须显式设置}
      CORPUS_URL: http://corpus-api:8081
      GATEWAY_URL: http://model-gateway:9000
      MCP_URL: http://mcp:9100
      OBJECT_ENDPOINT: minio:9000
      # **浏览器可达的地址**，预签名 URL 用它签。与内网地址用同一个的话，
      # 签出来的 URL 里带着 `minio:9000`，浏览器一访问就是 DNS 失败 ——
      # 而这只在真部署里才暴露
      OBJECT_PUBLIC_ENDPOINT: ${OBJECT_PUBLIC_ENDPOINT:-127.0.0.1:19000}
      OBJECT_ACCESS_KEY: ${OBJECT_ACCESS_KEY:-minioadmin}
      OBJECT_SECRET_KEY: ${OBJECT_SECRET_KEY:?OBJECT_SECRET_KEY 必须显式设置}
      OBJECT_BUCKET: deepdocparse
      REDIS_URL: redis://redis:6379/1
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    ports: ["8080:8080"]
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12

  # -------------------------------------------------------------- 语料面
  corpus-api:
    build:
      <<: *python-build
      target: corpus-api
    environment: *corpus-env
    # **不映射端口**：它只对内网开放。暴露出去等于任何人都能自称 admin
    expose: ["8081"]
    depends_on:
      corpus-migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8081/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12

  corpus-worker:
    build:
      <<: *python-build
      target: corpus-worker
    environment: *corpus-env
    depends_on:
      corpus-migrate: {condition: service_completed_successfully}
      minio: {condition: service_healthy}
    # 多副本安全：领取走 FOR UPDATE SKIP LOCKED，写结果比 generation
    deploy:
      replicas: ${WORKER_REPLICAS:-1}

  # ------------------------------------------------------------ 模型面
  model-gateway:
    build:
      <<: *python-build
      target: model-gateway
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN 必须显式设置}
      REDIS_URL: redis://redis:6379/2
      # 无 GPU 档位：只注册 borndigital。换档位 = 换这一行，不改代码
      MODELS_CONFIG: /registry/${MODELS_CONFIG:-models.cpu.yaml}
    volumes:
      - ../registry:/registry:ro
    expose: ["9000"]
    depends_on:
      redis: {condition: service_healthy}

  mcp:
    build:
      <<: *python-build
      target: mcp
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?SERVICE_TOKEN 必须显式设置}
      GATEWAY_URL: http://model-gateway:9000
      CORPUS_DATABASE_URL: postgresql+asyncpg://ddp:${POSTGRES_PASSWORD:-ddp}@postgres:5432/deepdocparse
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${OBJECT_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${OBJECT_SECRET_KEY:?OBJECT_SECRET_KEY 必须显式设置}
      MINIO_BUCKET: deepdocparse
      REDIS_URL: redis://redis:6379/2
    expose: ["9100"]
    depends_on:
      corpus-migrate: {condition: service_completed_successfully}

volumes:
  pgdata:
  miniodata:
